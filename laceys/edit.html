<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Lacey's Narrows</title>
<style>html,body{margin:0;background:#0c3c41;color:#eef4f3;font-family:-apple-system,sans-serif}p{padding:24px}a{color:#d5ecea}</style>
</head>
<body>
<p id="s">Loading the chart…</p>
<script>
fetch("https://raw.githubusercontent.com/tiffany148/Greers-Ferry-Lake-Map-II-/83688fec8d/laceys/index.html")
.then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
.then(function(html){
  if(html.indexOf("edit-toggle")===-1) throw new Error("not the editor");
  html = html.replace("<head>", "<head><script>try{if(!localStorage.getItem('laceys-reset-v91')){localStorage.removeItem('laceys-layout-v3');localStorage.setItem('laceys-reset-v91','1');}}catch(e){}<\/script>");
  html = html.replace("</body>",
    '<style>#easy{position:fixed;z-index:100000;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}#easy button{border:0;border-radius:12px;padding:12px 14px;font-weight:800;background:#d5ecea;color:#0c3c41}#easy-done{background:#f0c14b}#easy-del{background:#8a3a3a;color:#fff}#easy-sel{display:none;position:fixed;z-index:99999;top:8px;left:8px;right:8px;background:#1a5c62;color:#fff;border-radius:12px;padding:10px 12px;font-weight:800}#file-tap{position:fixed;z-index:100002;left:8px;right:8px;top:56px;background:#f0c14b;color:#1a1a1a;border-radius:12px;padding:14px;font-weight:800;text-align:center;text-decoration:none}</style>'
    + '<div id="easy-sel">Nothing selected</div>'
    + '<div id="easy"><button type="button" id="easy-undo">Undo</button><button type="button" id="easy-redo">Redo</button><button type="button" id="easy-del">Delete</button><button type="button" id="easy-done">Edit docks</button></div>'
    + '<script>(function(){function note(t){var el=document.getElementById("easy-sel"); if(!el) return; el.style.display="block"; el.textContent=t;}function payload(){try{ if(typeof buildPublishedPayload==="function") return buildPublishedPayload(); }catch(e){} return {docks:docks, marks:marks, groups:groups, publishedAt:new Date().toISOString()};} function saveHere(){try{ if(typeof saveNow==="function") saveNow(); else if(typeof saveLayout==="function") saveLayout(); note("Saved on this phone."); }catch(e){ note("Save failed."); }} function offerFile(name, obj){var text=JSON.stringify(obj,null,2); var blob=new Blob([text],{type:"application/json"}); var file=new File([blob], name, {type:"application/json"}); if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file], title:name}).then(function(){ note("File shared."); }).catch(function(){ tapLink(name, blob); }); return; } tapLink(name, blob); } function tapLink(name, blob){var old=document.getElementById("file-tap"); if(old) old.remove(); var a=document.createElement("a"); a.id="file-tap"; a.href=URL.createObjectURL(blob); a.download=name; a.textContent="Tap here to save "+name; document.body.appendChild(a); note("Yellow link is the download. Tap it."); } function label(){var on=document.body.classList.contains("editing"); var el=document.getElementById("easy-sel"); if(!on){ el.style.display="none"; return; } var names=[]; try{ if(typeof multi!=="undefined"&&multi.forEach){ multi.forEach(function(k){ var i=String(k).indexOf(":"), kind=String(k).slice(0,i), id=String(k).slice(i+1); if(kind==="slip"){ var s=(slips||[]).find(function(x){return String(x.id)===id;}); names.push("Slip "+(s&&s.num||id)); } else if(kind==="dock"){ var d=(docks||[]).find(function(x){return String(x.id)===id;}); names.push("Dock "+(d&&d.name||id)); } else { var m=(marks||[]).find(function(x){return String(x.id)===id;}); names.push((m&&(m.title||m.kind))||"Building"); } }); } if(!names.length&&typeof selected!=="undefined"&&selected){ var s=(slips||[]).find(function(x){return String(x.id)===String(selected);}); if(s) names.push("Slip "+s.num); } if(!names.length&&typeof selectedDock!=="undefined"&&selectedDock){ var d=(docks||[]).find(function(x){return String(x.id)===String(selectedDock);}); if(d) names.push("Dock "+d.name); } if(!names.length&&typeof selectedMark!=="undefined"&&selectedMark){ var m=(marks||[]).find(function(x){return String(x.id)===String(selectedMark);}); if(m) names.push(m.title||m.kind||"Building"); } }catch(e){} note(names.length?("Selected: "+names.join(", ")):"Nothing selected"); } function sync(){var on=document.body.classList.contains("editing"); document.getElementById("easy-undo").style.display=on?"inline-block":"none"; document.getElementById("easy-redo").style.display=on?"inline-block":"none"; document.getElementById("easy-del").style.display=on?"inline-block":"none"; document.getElementById("easy-done").textContent=on?"Done":"Edit docks"; label();} function del(){try{if(typeof selectedDock!=="undefined"&&selectedDock){var i=docks.findIndex(function(x){return x.id===selectedDock;}); if(i<0){note("Dock not found"); return;} var name=docks[i].name; docks.splice(i,1); selectedDock=null; selected=null; saveLayout(); redraw(); note("Deleted dock "+name); return;} if(typeof selectedMark!=="undefined"&&selectedMark){var j=marks.findIndex(function(m){return m.id===selectedMark;}); if(j<0){note("Piece not found"); return;} marks.splice(j,1); selectedMark=null; saveLayout(); redraw(); note("Deleted walkway"); return;} if(typeof selected!=="undefined"&&selected){docks.forEach(function(d){d.a=(d.a||[]).filter(function(n){return String(n)!==String(selected);}); d.b=(d.b||[]).filter(function(n){return String(n)!==String(selected);}); if(d.placed) delete d.placed[String(selected)];}); selected=null; saveLayout(); redraw(); note("Deleted slip"); return;} note("Tap the dock on the map first, then Delete.");}catch(e){note("Delete failed");}} var chart=document.getElementById("chart"), pinch=null; if(chart){ chart.addEventListener("touchstart", function(e){ if(document.body.classList.contains("editing")||e.touches.length<2) return; var a=e.touches[0], b=e.touches[1]; pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1, s:scale||1}; e.preventDefault(); }, {passive:false}); chart.addEventListener("touchmove", function(e){ if(!pinch||document.body.classList.contains("editing")||e.touches.length<2) return; var a=e.touches[0], b=e.touches[1], d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1; scale=Math.max(0.05, Math.min(16, pinch.s*(d/pinch.d))); try{applyZoom();}catch(err){} e.preventDefault(); }, {passive:false}); chart.addEventListener("touchend", function(){ pinch=null; }); } document.getElementById("easy-undo").onclick=function(e){e.preventDefault(); e.stopPropagation(); try{undo(); note("Undone");}catch(err){note("Nothing to undo");} setTimeout(label,40);}; document.getElementById("easy-redo").onclick=function(e){e.preventDefault(); e.stopPropagation(); try{redo(); note("Redone");}catch(err){} setTimeout(label,40);}; document.getElementById("easy-del").onclick=function(e){e.preventDefault(); e.stopPropagation(); del();}; document.getElementById("easy-done").onclick=function(e){e.preventDefault(); e.stopPropagation(); var t=document.getElementById("edit-toggle"); if(t) t.click(); sync();}; document.addEventListener("click", function(ev){ var saveBtn=ev.target.closest&&ev.target.closest("#btn-save-layout,#btn-save,#btn-save-m"); if(saveBtn){ ev.preventDefault(); ev.stopPropagation(); saveHere(); return; } var pubBtn=ev.target.closest&&ev.target.closest("#btn-download-published-layout,#btn-download-published-layout-dock"); if(pubBtn){ ev.preventDefault(); ev.stopPropagation(); saveHere(); offerFile("published-layout.json", payload()); return; } var dlBtn=ev.target.closest&&ev.target.closest("#download-layout"); if(dlBtn){ ev.preventDefault(); ev.stopPropagation(); saveHere(); offerFile("laceys-layout.json", payload()); return; } var delBtn=ev.target.closest&&ev.target.closest("#ed-del-dock"); if(delBtn){ ev.preventDefault(); ev.stopPropagation(); del(); return; } setTimeout(label,40); }, true); setInterval(label, 500); sync();})();<\/script></body>');
  document.open(); document.write(html); document.close();
})
.catch(function(){ document.getElementById("s").innerHTML='Could not open the chart. <a href="./">Open the map</a>'; });
</script>
</body>
</html>
