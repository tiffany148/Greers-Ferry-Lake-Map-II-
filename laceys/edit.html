<script>
fetch("https://raw.githubusercontent.com/tiffany148/Greers-Ferry-Lake-Map-II-/e278feea94/laceys/index.html")
.then(function(r){return r.text();}).then(function(html){
  html=html.replace('content="width=device-width, initial-scale=1, viewport-fit=cover"','content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover"');
  html=html.replace('</head>','<style>.chart{position:relative!important;height:58dvh!important;min-height:300px!important;overflow:hidden!important}body.map-only aside,body.map-only .sheet-handle{display:none!important}body.map-only .chart{height:78dvh!important}#show-panel{display:none;position:fixed;z-index:99999;left:8px;bottom:16px;border:0;border-radius:12px;padding:12px 14px;background:#d5ecea;color:#0c3c41;font-weight:800}body.map-only #show-panel{display:block}#sel-name{display:none;position:fixed;top:52px;left:8px;right:8px;z-index:99999;background:#1a5c62;color:#fff;border-radius:12px;padding:10px 12px;font-weight:800}#always-edit,#always-zin,#always-zout{position:fixed;z-index:99999;top:8px;border:0;border-radius:12px;padding:10px 12px;font-weight:800}#always-edit{left:8px;background:#f0c14b;color:#1a1a1a}#always-zin{left:130px;background:#d5ecea;color:#0c3c41}#always-zout{left:214px;background:#d5ecea;color:#0c3c41}#always-split,#always-walk,#always-undo,#always-redo{position:fixed;z-index:99999;border:0;border-radius:12px;padding:11px 12px;font-weight:800}#always-split{bottom:16px;left:8px;background:#7ec8ff;color:#0a1a28}#always-walk{bottom:16px;right:8px;background:#f4a261;color:#1a1a1a}#always-undo{bottom:64px;left:8px;background:#d5ecea;color:#0c3c41}#always-redo{bottom:64px;left:86px;background:#d5ecea;color:#0c3c41}body.screen-clear .photo-align,body.screen-clear .photo-op,body.screen-clear #edit-chrome,body.screen-clear aside{display:none!important}</style></head>');
  html=html.replace('</body>','<button id="always-edit" type="button">Edit docks</button><button id="always-zin" type="button">Zoom in</button><button id="always-zout" type="button">Zoom out</button><div id="sel-name">Nothing selected</div><button id="show-panel" type="button">Show panel</button><button id="always-undo" type="button">Undo</button><button id="always-redo" type="button">Redo</button><button id="always-split" type="button">Split dock 1 slips</button><button id="always-walk" type="button">Walkway between rows</button><script>(function(){try{maxZoomScale=function(){return 18;};}catch(e){}function dock1(){return docks.find(function(d){return String(d.name||d.id)==="1";});}function zoom(f){try{scale=Math.max(0.04,Math.min(18,(scale||1)*f));applyZoom();}catch(e){}}function showMap(){document.body.classList.add("map-only");document.body.classList.remove("panel-open");try{closeEditPanel();}catch(e){}var chart=document.getElementById("chart");if(chart)chart.style.height="78dvh";try{fitWholeMap();}catch(e){}}function showPanel(){document.body.classList.remove("map-only","screen-clear");var chart=document.getElementById("chart");if(chart)chart.style.height="58dvh";}function showSel(){var el=document.getElementById("sel-name");if(!document.body.classList.contains("editing")){el.style.display="none";return;}el.style.display="block";el.textContent="Selected";}function split1(){var d=dock1();if(!d){alert("Could not find dock 1.");return;}d.locked=false;try{bakeDockPlaced(d);}catch(e){}try{multi.clear();moveWholeChart=false;setMultiPick(false);}catch(e){}try{saveLayout();redraw();}catch(e){}alert("Dock 1 slips are detached.");}function addWalk(){var d=dock1();if(!d){alert("Could not find dock 1.");return;}var sw=Number(d.sw)||90,sh=Number(d.sh)||40,g=Number(d.gap)||3,n=Math.max((d.a||[]).length,(d.b||[]).length,1),x,y,w,h;if(d.type==="ew"){x=Number(d.x)||0;y=(Number(d.y)||0)+sh;w=n*(sw+g)-g;h=16;}else{x=(Number(d.x)||0)+sw;y=Number(d.y)||0;w=16;h=n*(sh+g)-g;}var m=marks.find(function(item){return item.title==="Dock 1 walkway";});if(!m){m={id:"walk-dock1-"+Date.now(),kind:"bar",title:"Dock 1 walkway"};marks.push(m);}m.x=x;m.y=y;m.w=w;m.h=h;m.rot=0;try{saveLayout();redraw();}catch(e){}alert("Walkway is between the two rows of slips.");}function sync(){var on=document.body.classList.contains("editing");document.getElementById("always-edit").textContent=on?"Done editing":"Edit docks";["always-split","always-walk","always-undo","always-redo"].forEach(function(id){document.getElementById(id).style.display=on?"block":"none";});}function exitToMap(){if(document.body.classList.contains("editing"))document.getElementById("edit-toggle").click();document.body.classList.remove("editing","panel-open");document.documentElement.classList.remove("editing");showMap();sync();}document.addEventListener("click",function(ev){var mapBtn=ev.target.closest&&ev.target.closest("#btn-sheet-close");if(!mapBtn)return;ev.preventDefault();ev.stopPropagation();showMap();},true);document.getElementById("show-panel").onclick=function(e){e.preventDefault();e.stopPropagation();showPanel();};document.getElementById("always-zin").onclick=function(e){e.preventDefault();e.stopPropagation();zoom(1.7);};document.getElementById("always-zout").onclick=function(e){e.preventDefault();e.stopPropagation();zoom(0.6);};document.getElementById("always-split").onclick=function(e){e.preventDefault();e.stopPropagation();split1();};document.getElementById("always-walk").onclick=function(e){e.preventDefault();e.stopPropagation();addWalk();};document.getElementById("always-undo").onclick=function(e){e.preventDefault();e.stopPropagation();try{undo();}catch(err){}};document.getElementById("always-redo").onclick=function(e){e.preventDefault();e.stopPropagation();try{redo();}catch(err){}};document.getElementById("always-edit").onclick=function(e){e.preventDefault();e.stopPropagation();if(document.body.classList.contains("editing"))exitToMap();else{document.body.classList.remove("screen-clear","map-only");document.getElementById("edit-toggle").click();sync();}};setTimeout(function(){try{fitWholeMap();}catch(e){}},400);sync();})();<\/script></body>');
  document.open();document.write(html);document.close();
