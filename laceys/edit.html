<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover"/>
<title>Lacey's Narrows (editable)</title>
<style>html,body{margin:0;background:#0c3c41;color:#eef4f3;font-family:-apple-system,system-ui,sans-serif}p{padding:24px}a{color:#d5ecea}</style>
</head>
<body>
<p id="s">Loading the edit chart…</p>
<script>
fetch("https://raw.githubusercontent.com/tiffany148/Greers-Ferry-Lake-Map-II-/e278feea94/laceys/index.html")
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
  .then(function(html){
    if(html.indexOf("edit-toggle")===-1) throw new Error("not editor");
    html = html.replace('content="width=device-width, initial-scale=1, viewport-fit=cover"','content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover"');
    html = html.replace('</head>',
      '<style id="page-scroll">'
      + 'html,body,html.editing,body.editing{overflow:auto!important;height:auto!important;min-height:100%!important;max-height:none!important;position:static!important;touch-action:pan-y!important}'
      + 'header,.search,.chips,.photo-op,.photo-align,.label-size-bar{position:relative!important;top:auto!important}'
      + '.map-stage,.layout,body.editing .layout{position:relative!important;overflow:visible!important;height:auto!important;top:auto!important;bottom:auto!important;flex:none!important}'
      + 'body.editing .chart{position:relative!important;inset:auto!important;touch-action:none!important;height:46dvh!important;min-height:46dvh!important;width:100%!important}'
      + 'body:not(.editing) .chart{position:relative!important;inset:auto!important;touch-action:pan-y!important;height:52dvh!important;min-height:52dvh!important;width:100%!important}'
      + '#always-edit,#always-stop{position:fixed;z-index:99999;top:8px;border:0;border-radius:12px;padding:10px 12px;font-weight:800;font-size:14px}'
      + '#always-edit{left:8px;background:#f0c14b;color:#1a1a1a}'
      + '#always-stop{right:8px;background:#15565b;color:#eef4f3}'
      + '#always-undo,#always-redo,#always-lock,#always-sep,#always-walk,#always-unlock{position:fixed;z-index:99999;border:0;border-radius:12px;padding:11px 12px;font-weight:800;font-size:14px}'
      + '#always-undo{bottom:108px;left:8px;background:#d5ecea;color:#0c3c41}'
      + '#always-redo{bottom:108px;left:86px;background:#d5ecea;color:#0c3c41}'
      + '#always-lock{bottom:60px;left:8px;background:#f0c14b;color:#1a1a1a}'
      + '#always-unlock{bottom:60px;right:8px;background:#15565b;color:#eef4f3}'
      + '#always-sep{bottom:12px;left:8px;background:#7ec8ff;color:#0a1a28}'
      + '#always-walk{bottom:12px;right:8px;background:#f4a261;color:#1a1a1a}'
      + '#sel-tools{display:none;position:fixed;top:54px;left:8px;right:8px;z-index:99998;background:rgba(10,51,56,.96);color:#eef4f3;border-radius:12px;padding:8px}'
      + '#sel-tools .row{display:flex;gap:6px;flex-wrap:wrap}#sel-tools label{font-size:11px;display:flex;flex-direction:column}#sel-tools input{width:64px;border:0;border-radius:8px;padding:6px;background:#15565b;color:#eef4f3}'
      + '</style></head>');
    html = html.replace('</body>',
      '<button type="button" id="always-edit">Edit docks</button><button type="button" id="always-stop">Stop selecting</button>'
      + '<button type="button" id="always-undo">Undo</button><button type="button" id="always-redo">Redo</button>'
      + '<button type="button" id="always-lock">Lock all</button><button type="button" id="always-unlock">Unlock selected</button>'
      + '<button type="button" id="always-sep">Separate 1 and 2</button><button type="button" id="always-walk">Detach dock 1 walkway</button>'
      + '<div id="sel-tools"><b>Selected</b><div class="row"><label>X<input id="st-x" type="number"></label><label>Y<input id="st-y" type="number"></label><label>Rotate<input id="st-rot" type="number"></label><label>Scale W<input id="st-w" type="number"></label><label>Scale H<input id="st-h" type="number"></label></div></div>'
      + '<script>(function(){'
      + 'function stopSelecting(){ try{ if(typeof setMultiPick==="function") setMultiPick(false);}catch(e){} try{ if(typeof multi!=="undefined"&&multi.clear) multi.clear(); }catch(e){} try{ moveWholeChart=false; }catch(e){} document.body.classList.remove("multipick","sel-active"); }'
      + 'function lockAll(){ docks.forEach(function(d){ d.locked=true; try{ bakeDockPlaced(d);}catch(e){} }); try{ saveLayout(); redraw(); }catch(e){} alert("All docks locked."); }'
      + 'function unlockSelected(){ try{ if(typeof ungroupUnlockThisDock==="function"){ ungroupUnlockThisDock(); alert("Selected dock unlocked. Drag that dock only."); return; } }catch(e){} alert("Tap the dock first, then Unlock selected."); }'
      + 'function separate12(){ var want=docks.filter(function(d){ var n=String(d.name||d.id).trim(); return n==="1"||n==="2"||String(d.id)==="1"||String(d.id)==="2"; }); want.forEach(function(d){ d.locked=false; try{ bakeDockPlaced(d);}catch(e){} }); if(typeof groups!=="undefined") groups=groups.filter(function(g){ return !(g.members||[]).some(function(k){ return want.some(function(d){ return k==="dock:"+d.id; }); }); }); stopSelecting(); try{ saveLayout(); redraw(); }catch(e){} alert("Docks 1 and 2 are separate."); }'
      + 'function detachWalk(){ var d1=docks.find(function(d){ return String(d.name||d.id).trim()==="1"||String(d.id)==="1"; }); if(!d1){ alert("Could not find dock 1."); return; } d1.locked=false; try{ bakeDockPlaced(d1);}catch(e){} var walks=(marks||[]).filter(function(m){ return m.kind==="bar"||/walk/i.test(m.title||m.id||""); }); if(typeof groups!=="undefined") groups=groups.filter(function(g){ var mem=g.members||[]; var hasDock=mem.indexOf("dock:"+d1.id)>=0; var hasWalk=mem.some(function(k){ return walks.some(function(w){ return k==="mark:"+w.id; }); }); return !(hasDock&&hasWalk); }); walks.forEach(function(w){ if(Math.abs((w.x||0)-d1.x)<80) w.x=(w.x||0)-40; }); stopSelecting(); try{ saveLayout(); redraw(); }catch(e){} alert("Dock 1 is detached from its walkway. The walkway is a separate bar. Tap the bar, not the slips, to move it."); }'
      + 'function exitToMap(){ stopSelecting(); if(document.body.classList.contains("editing")){ var t=document.getElementById("edit-toggle"); if(t) t.click(); } document.body.classList.remove("editing","panel-open"); document.documentElement.classList.remove("editing"); try{ closeEditPanel(); fitWholeMap(); }catch(e){} sync(); }'
      + 'var chart=document.getElementById("chart"); if(chart) chart.addEventListener("pointerdown", function(ev){ if(!document.body.classList.contains("editing")) ev.stopPropagation(); }, true);'
      + 'var b=document.getElementById("always-edit"), s=document.getElementById("always-stop"), u=document.getElementById("always-undo"), r=document.getElementById("always-redo"), lock=document.getElementById("always-lock"), un=document.getElementById("always-unlock"), sep=document.getElementById("always-sep"), walk=document.getElementById("always-walk"), bar=document.getElementById("sel-tools");'
      + 'function sync(){ var on=document.body.classList.contains("editing"); b.textContent=on?"Done editing":"Edit docks"; [u,r,s,lock,un,sep,walk].forEach(function(el){ el.style.display=on?"block":"none"; }); if(!on) bar.style.display="none"; }'
      + 'function setVal(id,v){ var el=document.getElementById(id); if(!el) return; el.value=v; el.dispatchEvent(new Event("input",{bubbles:true})); el.dispatchEvent(new Event("change",{bubbles:true})); }'
      + 'function readSel(){ if(!document.body.classList.contains("editing")){ bar.style.display="none"; return; } var x=document.getElementById("ed-x"), y=document.getElementById("ed-y"); if(!x&&!y){ bar.style.display="none"; return; } bar.style.display="block"; if(x) document.getElementById("st-x").value=x.value; if(y) document.getElementById("st-y").value=y.value; var rot=document.getElementById("ed-rot-num")||document.getElementById("ed-rot"), w=document.getElementById("ed-sw")||document.getElementById("ed-w"), h=document.getElementById("ed-sh")||document.getElementById("ed-h"); if(rot) document.getElementById("st-rot").value=rot.value; if(w) document.getElementById("st-w").value=w.value; if(h) document.getElementById("st-h").value=h.value; }'
      + 'function push(id,src){ var el=document.getElementById(src); if(el) setVal(id, el.value); }'
      + 'document.getElementById("st-x").onchange=function(){ push("ed-x","st-x"); }; document.getElementById("st-y").onchange=function(){ push("ed-y","st-y"); }; document.getElementById("st-rot").onchange=function(){ push("ed-rot-num","st-rot"); push("ed-rot","st-rot"); }; document.getElementById("st-w").onchange=function(){ if(document.getElementById("ed-sw")) push("ed-sw","st-w"); else push("ed-w","st-w"); }; document.getElementById("st-h").onchange=function(){ if(document.getElementById("ed-sh")) push("ed-sh","st-h"); else push("ed-h","st-h"); };'
      + 's.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); stopSelecting(); try{ redraw(); }catch(e){} };'
      + 'u.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); try{ undo(); }catch(e){} };'
      + 'r.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); try{ redo(); }catch(e){} };'
      + 'lock.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); lockAll(); };'
      + 'un.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); unlockSelected(); };'
      + 'sep.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); separate12(); };'
      + 'walk.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); detachWalk(); };'
      + 'b.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); if(document.body.classList.contains("editing")) exitToMap(); else { var t=document.getElementById("edit-toggle"); if(t) t.click(); sync(); } };'
      + 'document.addEventListener("click", function(ev){ var mapBtn=ev.target.closest&&ev.target.closest("#btn-sheet-close,#edit-fab-done,#edit-toggle-mobile"); if(!mapBtn) return; ev.preventDefault(); ev.stopPropagation(); if(mapBtn.id==="btn-sheet-close"){ try{ closeEditPanel(); }catch(e){} document.body.classList.remove("panel-open"); return; } exitToMap(); }, true);'
      + 'if(typeof renderDockEditor==="function" && !renderDockEditor._wrapped){ var orig=renderDockEditor; renderDockEditor=function(){ var out=orig.apply(this, arguments); setTimeout(readSel,0); return out; }; renderDockEditor._wrapped=true; }'
      + 'setInterval(function(){ if(document.body.classList.contains("editing")) readSel(); }, 800); sync();'
      + '})();<\/script></body>');
    document.open(); document.write(html); document.close();
  })
  .catch(function(){ document.getElementById("s").innerHTML='Could not open the edit chart.'; });
</script>
</body>
</html>
