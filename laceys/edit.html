<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Lacey's Narrows</title>
<style>html,body{margin:0;background:#0c3c41;color:#eef4f3;font-family:-apple-system,sans-serif}p{padding:24px}a{color:#d5ecea}</style>
</head>
<body>
<p id="s">Loading the chart…</p>
<script>
fetch("https://raw.githubusercontent.com/tiffany148/Greers-Ferry-Lake-Map-II-/83688fec8d/laceys/index.html")
.then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
.then(function(html){
  if(html.indexOf("edit-toggle")===-1) throw new Error("not the editor");
  html = html.replace("<head>", "<head><script>try{if(!localStorage.getItem('laceys-reset-v91')){localStorage.removeItem('laceys-layout-v3');localStorage.setItem('laceys-reset-v91','1');}}catch(e){}<\/script>");
  html = html.replace("</body>",
    '<style>#easy{position:fixed;z-index:100000;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}#easy button{border:0;border-radius:12px;padding:12px 14px;font-weight:800;background:#d5ecea;color:#0c3c41}#easy-done{background:#f0c14b}#easy-del{background:#8a3a3a;color:#fff}#easy-sel{position:fixed;z-index:99999;top:8px;left:8px;right:8px;background:#1a5c62;color:#fff;border-radius:12px;padding:8px 10px;font-weight:800}</style>'
    + '<div id="easy-sel">Tap a dock, then Delete</div>'
    + '<div id="easy"><button type="button" id="easy-undo">Undo</button><button type="button" id="easy-redo">Redo</button><button type="button" id="easy-del">Delete</button><button type="button" id="easy-done">Edit docks</button></div>'
    + '<script>(function(){function note(t){var el=document.getElementById("easy-sel"); if(el) el.textContent=t;}function sync(){var on=document.body.classList.contains("editing"); document.getElementById("easy-undo").style.display=on?"inline-block":"none"; document.getElementById("easy-redo").style.display=on?"inline-block":"none"; document.getElementById("easy-del").style.display=on?"inline-block":"none"; document.getElementById("easy-done").textContent=on?"Done":"Edit docks";} function del(){try{if(typeof selectedDock!=="undefined"&&selectedDock){var i=docks.findIndex(function(x){return x.id===selectedDock;}); if(i<0){note("Dock not found"); return;} var name=docks[i].name; docks.splice(i,1); selectedDock=null; selected=null; saveLayout(); redraw(); note("Deleted dock "+name); return;} if(typeof selectedMark!=="undefined"&&selectedMark){var j=marks.findIndex(function(m){return m.id===selectedMark;}); if(j<0){note("Piece not found"); return;} marks.splice(j,1); selectedMark=null; saveLayout(); redraw(); note("Deleted walkway"); return;} if(typeof selected!=="undefined"&&selected){docks.forEach(function(d){d.a=(d.a||[]).filter(function(n){return String(n)!==String(selected);}); d.b=(d.b||[]).filter(function(n){return String(n)!==String(selected);}); if(d.placed) delete d.placed[String(selected)];}); selected=null; saveLayout(); redraw(); note("Deleted slip"); return;} note("Tap the dock on the map first, then Delete.");}catch(e){note("Delete failed");}} document.getElementById("easy-undo").onclick=function(e){e.preventDefault(); e.stopPropagation(); try{undo(); note("Undone");}catch(err){note("Nothing to undo");}}; document.getElementById("easy-redo").onclick=function(e){e.preventDefault(); e.stopPropagation(); try{redo(); note("Redone");}catch(err){}}; document.getElementById("easy-del").onclick=function(e){e.preventDefault(); e.stopPropagation(); del();}; document.getElementById("easy-done").onclick=function(e){e.preventDefault(); e.stopPropagation(); var t=document.getElementById("edit-toggle"); if(t) t.click(); sync();}; document.addEventListener("click", function(ev){ var delBtn=ev.target.closest&&ev.target.closest("#ed-del-dock"); if(delBtn){ ev.preventDefault(); ev.stopPropagation(); del(); return; } }, true); sync();})();<\/script></body>');
  document.open(); document.write(html); document.close();
})
.catch(function(){ document.getElementById("s").innerHTML='Could not open the chart. <a href="./">Open the map</a>'; });
</script>
</body>
</html>
