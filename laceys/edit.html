<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Lacey's Narrows</title>
<style>html,body{margin:0;background:#0c3c41;color:#eef4f3;font-family:-apple-system,sans-serif}p{padding:24px}a{color:#d5ecea}</style>
</head>
<body>
<p id="s">Loading the V91 chart…</p>
<script>
fetch("https://raw.githubusercontent.com/tiffany148/Greers-Ferry-Lake-Map-II-/83688fec8d/laceys/index.html")
.then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
.then(function(html){
  if(html.indexOf("edit-toggle")===-1) throw new Error("not the editor");
  html = html.replace("<head>", "<head><script>try{if(!localStorage.getItem('laceys-reset-v91')){localStorage.removeItem('laceys-layout-v3');localStorage.setItem('laceys-reset-v91','1');}}catch(e){}<\/script>");
  html = html.replace("</body>",
    '<style>#easy{position:fixed;z-index:100000;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}#easy button{border:0;border-radius:12px;padding:12px 14px;font-weight:800;background:#d5ecea;color:#0c3c41}#easy-done{background:#f0c14b}</style>'
    + '<div id="easy"><button type="button" id="easy-undo">Undo</button><button type="button" id="easy-redo">Redo</button><button type="button" id="easy-done">Edit docks</button></div>'
    + '<script>(function(){function sync(){var on=document.body.classList.contains("editing"); document.getElementById("easy-undo").style.display=on?"inline-block":"none"; document.getElementById("easy-redo").style.display=on?"inline-block":"none"; document.getElementById("easy-done").textContent=on?"Done":"Edit docks";} document.getElementById("easy-undo").onclick=function(e){e.preventDefault(); e.stopPropagation(); try{undo();}catch(err){}}; document.getElementById("easy-redo").onclick=function(e){e.preventDefault(); e.stopPropagation(); try{redo();}catch(err){}}; document.getElementById("easy-done").onclick=function(e){e.preventDefault(); e.stopPropagation(); var t=document.getElementById("edit-toggle"); if(t) t.click(); sync();}; sync();})();<\/script></body>');
  document.open(); document.write(html); document.close();
})
.catch(function(){ document.getElementById("s").innerHTML='Could not open the V91 chart. <a href="./">Open the map</a>'; });
</script>
</body>
</html>
