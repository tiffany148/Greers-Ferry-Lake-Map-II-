<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Lacey's Narrows</title>
<style>html,body{margin:0;background:#0c3c41;color:#eef4f3;font-family:-apple-system,sans-serif}p{padding:24px}a{color:#d5ecea}</style>
</head>
<body>
<p id="s">Loading the chart…</p>
<script>
fetch("https://raw.githubusercontent.com/tiffany148/Greers-Ferry-Lake-Map-II-/main/laceys/index.html")
.then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
.then(function(html){
  if(html.indexOf("edit-toggle")===-1) throw new Error("not the editor");
  html = html.replace("</body>",
    '<style>#easy{position:fixed;z-index:100000;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;justify-content:center}#easy button{border:0;border-radius:12px;padding:12px 10px;font-weight:800;background:#d5ecea;color:#0c3c41}#easy-done{background:#f0c14b}#easy-sel{position:fixed;z-index:99999;top:8px;left:8px;right:8px;background:#1a5c62;color:#fff;border-radius:12px;padding:8px 10px;font-weight:800}</style>'
    + '<div id="easy-sel">Nothing selected</div>'
    + '<div id="easy"><button type="button" id="easy-undo">Undo</button><button type="button" id="easy-redo">Redo</button><button type="button" id="easy-list">Checklist</button><button type="button" id="easy-done">Edit docks</button></div>'
    + '<script>(function(){function note(t){var el=document.getElementById("easy-sel"); if(el) el.textContent=t;}function label(){var names=[];try{if(typeof multi!=="undefined"&&multi.forEach){multi.forEach(function(k){var i=String(k).indexOf(":"), kind=String(k).slice(0,i), id=String(k).slice(i+1); if(kind==="slip"){var s=(slips||[]).find(function(x){return String(x.id)===id;}); names.push("Slip "+(s&&s.num||id));} else if(kind==="dock"){var d=(docks||[]).find(function(x){return String(x.id)===id;}); names.push("Dock "+(d&&d.name||id));} else {var m=(marks||[]).find(function(x){return String(x.id)===id;}); names.push((m&&(m.title||m.kind))||"Building");}});} if(!names.length&&typeof selected!=="undefined"&&selected){var s=(slips||[]).find(function(x){return String(x.id)===String(selected);}); if(s) names.push("Slip "+s.num);} if(!names.length&&typeof selectedDock!=="undefined"&&selectedDock){var d=(docks||[]).find(function(x){return String(x.id)===String(selectedDock);}); if(d) names.push("Dock "+d.name);} if(!names.length&&typeof selectedMark!=="undefined"&&selectedMark){var m=(marks||[]).find(function(x){return String(x.id)===String(selectedMark);}); if(m) names.push(m.title||m.kind||"Building");}}catch(e){} note(names.length?names.join(", "):"Nothing selected");} function sync(){var on=document.body.classList.contains("editing"); document.getElementById("easy-done").textContent=on?"Done":"Edit docks";} document.getElementById("easy-undo").onclick=function(e){e.preventDefault();e.stopPropagation(); try{undo(); note("Undone");}catch(err){note("Nothing to undo");} setTimeout(label,50);}; document.getElementById("easy-redo").onclick=function(e){e.preventDefault();e.stopPropagation(); try{redo(); note("Redone");}catch(err){} setTimeout(label,50);}; document.getElementById("easy-list").onclick=function(e){e.preventDefault();e.stopPropagation(); if(!document.body.classList.contains("editing")){var t=document.getElementById("edit-toggle"); if(t) t.click();} try{ if(typeof setMultiPick==="function") setMultiPick(true);}catch(err){} var b=document.getElementById("btn-multi-hdr")||document.getElementById("btn-multi"); if(b) b.click(); note("Tick one slip in the checklist, or tap a slip on the map.");}; document.getElementById("easy-done").onclick=function(e){e.preventDefault();e.stopPropagation(); try{ if(typeof setMultiPick==="function") setMultiPick(false);}catch(err){} var t=document.getElementById("edit-toggle"); if(t) t.click(); sync(); label();}; document.addEventListener("click", function(){ setTimeout(label,40); }, true); setInterval(function(){ if(document.body.classList.contains("editing")) label(); }, 700); sync();})();<\/script></body>');
  document.open(); document.write(html); document.close();
})
.catch(function(){ document.getElementById("s").innerHTML='Could not open the chart. <a href="./">Open the map</a>'; });
</script>
</body>
</html>
