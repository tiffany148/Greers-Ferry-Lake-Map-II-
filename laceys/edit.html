<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover"/>
<title>Lacey's Narrows (editable)</title>
<style>html,body{margin:0;background:#0c3c41;color:#eef4f3;font-family:-apple-system,sans-serif}</style>
</head>
<body><p id="s">Loading the edit chart…</p>
<script>
fetch("https://raw.githubusercontent.com/tiffany148/Greers-Ferry-Lake-Map-II-/e278feea94/laceys/index.html").then(function(r){return r.text();}).then(function(html){
  html=html.replace('viewport-fit=cover','viewport-fit=cover, user-scalable=yes');
  html=html.replace('</head>','<style>.chart{height:62dvh!important;min-height:320px!important;overflow:hidden!important;touch-action:none!important}#bar{position:fixed;z-index:100000;left:8px;right:8px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px;justify-content:center}#bar button{border:0;border-radius:12px;padding:12px 10px;font-weight:800;background:#d5ecea;color:#0c3c41}#always-edit{background:#f0c14b}#always-del{background:#8a3a3a;color:#fff}#sel-name{position:fixed;z-index:99999;top:8px;left:8px;right:8px;background:#1a5c62;color:#fff;border-radius:12px;padding:8px 10px;font-weight:800}</style></head>');
  html=html.replace('</body>','<div id="sel-name">Tap a dock, then Delete</div><div id="bar"><button type="button" id="always-undo">Undo</button><button type="button" id="always-redo">Redo</button><button type="button" id="always-zin">+</button><button type="button" id="always-zout">-</button><button type="button" id="always-del">Delete</button><button type="button" id="always-edit">Edit docks</button></div><script>(function(){function note(t){document.getElementById("sel-name").textContent=t;}function zoom(f){try{if(typeof scale!=="number")scale=1;scale=Math.max(0.05,Math.min(16,scale*f));applyZoom();}catch(e){var b=document.getElementById(f>1?"z-in":"z-out");if(b)b.click();}}function label(){var names=[];try{if(selectedDock){var d=docks.find(function(x){return x.id===selectedDock;});if(d)names.push("Dock "+d.name);}if(selected){var s=slips.find(function(x){return String(x.id)===String(selected);});if(s)names.push("Slip "+s.num);}if(selectedMark){var m=marks.find(function(x){return x.id===selectedMark;});if(m)names.push(m.title||"Walkway");}}catch(e){}if(names.length)note(names.join(" | "));}function del(){try{if(!document.body.classList.contains("editing")){var t=document.getElementById("edit-toggle");if(t)t.click();}if(selectedDock){var i=docks.findIndex(function(x){return x.id===selectedDock;});if(i<0){note("Dock not found");return;}var name=docks[i].name;docks.splice(i,1);selectedDock=null;selected=null;saveLayout();redraw();note("Deleted dock "+name+". Undo brings it back.");return;}if(selectedMark){var j=marks.findIndex(function(m){return m.id===selectedMark;});if(j<0){note("Piece not found");return;}marks.splice(j,1);selectedMark=null;saveLayout();redraw();note("Deleted. Undo brings it back.");return;}if(selected){docks.forEach(function(d){d.a=(d.a||[]).filter(function(n){return String(n)!==String(selected);});d.b=(d.b||[]).filter(function(n){return String(n)!==String(selected);});if(d.placed)delete d.placed[String(selected)];});selected=null;saveLayout();redraw();note("Deleted slip. Undo brings it back.");return;}note("Tap the dock on the map first, then Delete.");}catch(e){note("Delete failed: "+e.message);}}document.getElementById("always-zin").onclick=function(e){e.preventDefault();e.stopPropagation();zoom(1.6);};document.getElementById("always-zout").onclick=function(e){e.preventDefault();e.stopPropagation();zoom(0.62);};document.getElementById("always-undo").onclick=function(e){e.preventDefault();e.stopPropagation();try{undo();note("Undone");}catch(err){note("Nothing to undo");}};document.getElementById("always-redo").onclick=function(e){e.preventDefault();e.stopPropagation();try{redo();note("Redone");}catch(err){}};document.getElementById("always-del").onclick=function(e){e.preventDefault();e.stopPropagation();del();};document.getElementById("always-edit").onclick=function(e){e.preventDefault();e.stopPropagation();var t=document.getElementById("edit-toggle");if(t)t.click();document.getElementById("always-edit").textContent=document.body.classList.contains("editing")?"Done":"Edit docks";label();};document.addEventListener("click",function(){setTimeout(label,40);},true);setTimeout(function(){try{fitWholeMap();}catch(e){}},300);})();<\/script></body>');
  document.open();document.write(html);document.close();
}).catch(function(){document.getElementById("s").textContent="Could not open the edit chart.";});
</script></body></html>
