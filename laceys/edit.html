<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover"/>
<title>Lacey's Narrows (editable)</title>
<style>html,body{margin:0;background:#0c3c41;color:#eef4f3;font-family:-apple-system,system-ui,sans-serif}p{padding:24px}a{color:#d5ecea}</style>
</head>
<body>
<p id="s">Loading the edit chart…</p>
<script>
fetch("https://raw.githubusercontent.com/tiffany148/Greers-Ferry-Lake-Map-II-/e278feea94/laceys/index.html")
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
  .then(function(html){
    if(html.indexOf("edit-toggle")===-1) throw new Error("not editor");
    html = html.replace(
      'content="width=device-width, initial-scale=1, viewport-fit=cover"',
      'content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover"'
    );
    html = html.replace('</head>',
      '<style id="page-scroll">'
      + 'html,body{overflow:auto!important;overflow-x:hidden!important;height:auto!important;min-height:100%!important;max-height:none!important;position:static!important}'
      + 'header{position:relative!important;top:auto!important}'
      + '.map-stage{overflow:visible!important;height:auto!important;flex:none!important}'
      + '.layout{height:auto!important;min-height:58dvh!important}'
      + '.chart{touch-action:none!important;min-height:58dvh!important;height:58dvh!important;width:100%!important}'
      + '#always-edit{position:fixed;top:8px;left:8px;z-index:99999;border:0;border-radius:12px;padding:12px 16px;background:#f0c14b;color:#1a1a1a;font-weight:800;font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.4)}'
      + '</style></head>'
    );
    html = html.replace('</body>',
      '<button type="button" id="always-edit">Edit docks</button>'
      + '<script>'
      + '(function(){'
      + 'var b=document.getElementById("always-edit");'
      + 'function sync(){'
      + '  var on=document.body.classList.contains("editing");'
      + '  b.textContent=on?"Done editing":"Edit docks";'
      + '}'
      + 'b.onclick=function(){'
      + '  var t=document.getElementById("edit-toggle")||document.getElementById("edit-toggle-mobile");'
      + '  if(t) t.click();'
      + '  setTimeout(sync, 50);'
      + '};'
      + 'window.scrollTo(0,0);'
      + 'sync();'
      + '})();'
      + '<\/script></body>'
    );
    document.open();
    document.write(html);
    document.close();
  })
  .catch(function(){
    document.getElementById("s").innerHTML = 'Could not open the edit chart. <a href="../laceys-sandbox/">Open sandbox editor</a>';
  });
</script>
</body>
</html>
