<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover"/>
<title>Lacey's Narrows (editable)</title>
<style>html,body{margin:0;background:#0c3c41;color:#eef4f3;font-family:-apple-system,system-ui,sans-serif}p{padding:24px}a{color:#d5ecea}</style>
</head>
<body>
<p id="s">Loading the edit chart…</p>
<script>
fetch("https://raw.githubusercontent.com/tiffany148/Greers-Ferry-Lake-Map-II-/e278feea94/laceys/index.html")
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
  .then(function(html){
    if(html.indexOf("edit-toggle")===-1) throw new Error("not editor");
    html = html.replace('content="width=device-width, initial-scale=1, viewport-fit=cover"','content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover"');
    html = html.replace('</head>',
      '<style id="page-scroll">'
      + 'html,body,html.editing,body.editing{overflow:auto!important;height:auto!important;position:static!important;touch-action:pan-y!important}'
      + '.map-stage,.layout,body.editing .layout{position:relative!important;height:auto!important;top:auto!important}'
      + 'body.editing .chart{position:relative!important;height:46dvh!important;touch-action:none!important}'
      + 'body.screen-clear .photo-align,body.screen-clear .photo-op,body.screen-clear .label-size-bar,body.screen-clear #edit-chrome,body.screen-clear aside,body.screen-clear #edit-fabs,body.screen-clear #sel-tools{display:none!important}'
      + '#sel-name{display:none;position:fixed;top:52px;left:8px;right:8px;z-index:99999;background:#1a5c62;color:#fff;border-radius:12px;padding:10px 12px;font-weight:800;font-size:15px}'
      + '#always-edit,#always-zoom,#always-pick{position:fixed;z-index:99999;top:8px;border:0;border-radius:12px;padding:10px 12px;font-weight:800}'
      + '#always-edit{left:8px;background:#f0c14b;color:#1a1a1a}#always-zoom{left:128px;background:#d5ecea;color:#0c3c41}#always-pick{right:8px;background:#7ec8ff;color:#0a1a28}'
      + '#always-undo,#always-redo,#always-lock,#always-unlock,#always-sep,#always-walk{position:fixed;z-index:99999;border:0;border-radius:12px;padding:11px 12px;font-weight:800}'
      + '#always-undo{bottom:108px;left:8px;background:#d5ecea;color:#0c3c41}#always-redo{bottom:108px;left:86px;background:#d5ecea;color:#0c3c41}'
      + '#always-lock{bottom:60px;left:8px;background:#f0c14b;color:#1a1a1a}#always-unlock{bottom:60px;right:8px;background:#15565b;color:#eef4f3}'
      + '#always-sep{bottom:12px;left:8px;background:#7ec8ff;color:#0a1a28}#always-walk{bottom:12px;right:8px;background:#f4a261;color:#1a1a1a}'
      + '#pick-list.big-pick{display:block!important;position:fixed;left:8px;right:8px;top:108px;bottom:150px;z-index:99997;background:#0a3338;border-radius:14px}'
      + '#pick-list.big-pick .pick-row{min-height:56px;font-size:18px}'
      + '</style></head>');
    html = html.replace('</body>',
      '<button type="button" id="always-edit">Edit docks</button><button type="button" id="always-zoom">Zoom in</button><button type="button" id="always-pick">Pick slips</button>'
      + '<div id="sel-name">Nothing selected</div>'
      + '<button type="button" id="always-undo">Undo</button><button type="button" id="always-redo">Redo</button>'
      + '<button type="button" id="always-lock">Lock all</button><button type="button" id="always-unlock">Unlock selected</button>'
      + '<button type="button" id="always-sep">Separate 1 and 2</button><button type="button" id="always-walk">Detach dock 1 walkway</button>'
      + '<script>(function(){'
      + 'try{ maxZoomScale=function(){ return 18; }; }catch(e){}'
      + 'function selectionText(){ var names=[]; try{ if(typeof multi!=="undefined" && multi.forEach){ multi.forEach(function(k){ var i=String(k).indexOf(":"); var kind=String(k).slice(0,i), id=String(k).slice(i+1); if(kind==="slip"){ var s=(slips||[]).find(function(x){ return String(x.id)===id; }); names.push("Slip "+(s&&s.num||id)); } else if(kind==="dock"){ var d=(docks||[]).find(function(x){ return String(x.id)===id; }); names.push("Dock "+(d&&d.name||id)); } else { var m=(marks||[]).find(function(x){ return String(x.id)===id; }); names.push((m&&(m.title||m.kind))||"Building "+id); } }); } }catch(e){} if(!names.length){ try{ if(typeof selected!=="undefined" && selected){ var s2=(slips||[]).find(function(x){ return String(x.id)===String(selected); }); if(s2) names.push("Slip "+s2.num); } if(typeof selectedDock!=="undefined" && selectedDock){ var d2=(docks||[]).find(function(x){ return String(x.id)===String(selectedDock); }); if(d2) names.push("Dock "+d2.name); } if(typeof selectedMark!=="undefined" && selectedMark){ var m2=(marks||[]).find(function(x){ return String(x.id)===String(selectedMark); }); if(m2) names.push(m2.title||m2.kind||"Building"); } }catch(e){} } return names.length? names.join(", "):"Nothing selected"; }'
      + 'function showSel(){ var el=document.getElementById("sel-name"); if(!document.body.classList.contains("editing")){ el.style.display="none"; return; } el.style.display="block"; el.textContent=selectionText(); }'
      + 'function stopSelecting(){ try{ if(typeof setMultiPick==="function") setMultiPick(false);}catch(e){} try{ if(typeof multi!=="undefined"&&multi.clear) multi.clear(); }catch(e){} try{ moveWholeChart=false; }catch(e){} document.body.classList.remove("multipick","sel-active"); var box=document.getElementById("pick-list"); if(box){ box.classList.remove("big-pick"); box.hidden=true; } showSel(); }'
      + 'function hideBars(){ document.body.classList.add("screen-clear"); }'
      + 'function lockAll(){ docks.forEach(function(d){ d.locked=true; try{ bakeDockPlaced(d);}catch(e){} }); try{ saveLayout(); redraw(); }catch(e){} alert("All docks locked."); }'
      + 'function unlockSelected(){ try{ if(typeof ungroupUnlockThisDock==="function"){ ungroupUnlockThisDock(); showSel(); return; } }catch(e){} alert("Tap the dock first, then Unlock selected."); }'
      + 'function separate12(){ var want=docks.filter(function(d){ var n=String(d.name||d.id).trim(); return n==="1"||n==="2"; }); want.forEach(function(d){ d.locked=false; try{ bakeDockPlaced(d);}catch(e){} }); if(typeof groups!=="undefined") groups=groups.filter(function(g){ return !(g.members||[]).some(function(k){ return want.some(function(d){ return k==="dock:"+d.id; }); }); }); stopSelecting(); try{ saveLayout(); redraw(); }catch(e){} alert("Docks 1 and 2 are separate."); }'
      + 'function detachWalk(){ var d1=docks.find(function(d){ return String(d.name||d.id).trim()==="1"; }); if(!d1){ alert("Could not find dock 1."); return; } d1.locked=false; try{ bakeDockPlaced(d1);}catch(e){} var walks=(marks||[]).filter(function(m){ return m.kind==="bar"; }); if(typeof groups!=="undefined") groups=groups.filter(function(g){ var mem=g.members||[]; return !(mem.indexOf("dock:"+d1.id)>=0 && mem.some(function(k){ return walks.some(function(w){ return k==="mark:"+w.id; }); })); }); stopSelecting(); try{ saveLayout(); redraw(); }catch(e){} alert("Dock 1 is detached from its walkway."); }'
      + 'function exitToMap(){ stopSelecting(); if(document.body.classList.contains("editing")){ var t=document.getElementById("edit-toggle"); if(t) t.click(); } document.body.classList.remove("editing","panel-open"); document.documentElement.classList.remove("editing"); try{ closeEditPanel(); fitWholeMap(); }catch(e){} hideBars(); sync(); }'
      + 'function pickSlips(){ if(!document.body.classList.contains("editing")){ var t=document.getElementById("edit-toggle"); if(t) t.click(); } document.body.classList.remove("screen-clear"); try{ setMultiPick(true);}catch(e){} var box=document.getElementById("pick-list"); if(box){ box.hidden=false; box.classList.add("big-pick"); } showSel(); }'
      + 'function zoomIn(){ var c=document.getElementById("chart"); try{ zoomToward(c.clientWidth/2,c.clientHeight/2,1.8);}catch(e){} }'
      + 'var chart=document.getElementById("chart"); if(chart) chart.addEventListener("pointerdown", function(){ setTimeout(showSel, 40); }, true);'
      + 'var b=document.getElementById("always-edit");'
      + 'function sync(){ var on=document.body.classList.contains("editing"); b.textContent=on?"Done editing":"Edit docks"; ["always-undo","always-redo","always-lock","always-unlock","always-sep","always-walk","always-pick"].forEach(function(id){ document.getElementById(id).style.display=on?"block":"none"; }); if(!on){ document.body.classList.add("screen-clear"); document.getElementById("sel-name").style.display="none"; } else document.body.classList.remove("screen-clear"); showSel(); }'
      + 'document.getElementById("always-undo").onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); try{ undo(); }catch(e){} showSel(); };'
      + 'document.getElementById("always-redo").onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); try{ redo(); }catch(e){} showSel(); };'
      + 'document.getElementById("always-zoom").onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); zoomIn(); };'
      + 'document.getElementById("always-pick").onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); pickSlips(); };'
      + 'document.getElementById("always-lock").onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); lockAll(); };'
      + 'document.getElementById("always-unlock").onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); unlockSelected(); };'
      + 'document.getElementById("always-sep").onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); separate12(); };'
      + 'document.getElementById("always-walk").onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); detachWalk(); };'
      + 'b.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); if(document.body.classList.contains("editing")) exitToMap(); else { document.body.classList.remove("screen-clear"); var t=document.getElementById("edit-toggle"); if(t) t.click(); sync(); } };'
      + 'document.addEventListener("click", function(ev){ var mapBtn=ev.target.closest&&ev.target.closest("#btn-sheet-close,#edit-fab-done,#edit-toggle-mobile,.pick-row"); if(!mapBtn) return; if(mapBtn.classList&&mapBtn.classList.contains("pick-row")){ setTimeout(showSel, 50); return; } ev.preventDefault(); ev.stopPropagation(); if(mapBtn.id==="btn-sheet-close"){ try{ closeEditPanel(); }catch(e){} document.body.classList.remove("panel-open"); hideBars(); return; } exitToMap(); }, true);'
      + 'setInterval(showSel, 500); sync();'
      + '})();<\/script></body>');
    document.open(); document.write(html); document.close();
  })
  .catch(function(){ document.getElementById("s").innerHTML='Could not open the edit chart.'; });
</script>
</body>
</html>
