<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover"/>
<title>Lacey's Narrows (editable)</title>
<style>html,body{margin:0;background:#0c3c41;color:#eef4f3;font-family:-apple-system,system-ui,sans-serif}</style>
</head>
<body>
<p id="s">Loading the edit chart…</p>
<script>
fetch("https://raw.githubusercontent.com/tiffany148/Greers-Ferry-Lake-Map-II-/e278feea94/laceys/index.html")
.then(function(r){return r.text();}).then(function(html){
  html=html.replace('content="width=device-width, initial-scale=1, viewport-fit=cover"','content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover"');
  html=html.replace('</head>','<style>.chart{position:relative!important;height:58dvh!important;min-height:300px!important;overflow:hidden!important}body.map-only aside{display:none!important}body.map-only .chart{height:72dvh!important}#show-panel{display:none;position:fixed;z-index:99999;left:8px;bottom:calc(16px + env(safe-area-inset-bottom));border:0;border-radius:12px;padding:12px 14px;background:#d5ecea;color:#0c3c41;font-weight:800}body.map-only #show-panel{display:block}#always-edit{position:fixed;z-index:100000;right:8px;bottom:calc(16px + env(safe-area-inset-bottom));border:0;border-radius:14px;padding:14px 16px;background:#f0c14b;color:#1a1a1a;font-weight:800;font-size:16px;box-shadow:0 4px 16px rgba(0,0,0,.4)}#always-zin,#always-zout{position:fixed;z-index:99999;top:70px;border:0;border-radius:12px;padding:10px 12px;font-weight:800;background:#d5ecea;color:#0c3c41}#always-zin{right:92px}#always-zout{right:8px}#always-split,#always-walk{position:fixed;z-index:99999;left:8px;border:0;border-radius:12px;padding:11px 12px;font-weight:800}#always-split{bottom:calc(64px + env(safe-area-inset-bottom));background:#7ec8ff;color:#0a1a28}#always-walk{bottom:calc(112px + env(safe-area-inset-bottom));background:#f4a261;color:#1a1a1a}#sel-name{display:none;position:fixed;top:64px;left:8px;right:8px;z-index:99999;background:#1a5c62;color:#fff;border-radius:12px;padding:10px 12px;font-weight:800}</style></head>');
  html=html.replace('</body>','<button id="always-edit" type="button">Edit docks</button><button id="always-zin" type="button">Zoom in</button><button id="always-zout" type="button">Zoom out</button><div id="sel-name">Nothing selected</div><button id="show-panel" type="button">Show panel</button><button id="always-split" type="button">Split dock 1 slips</button><button id="always-walk" type="button">Walkway between rows</button><script>(function(){try{maxZoomScale=function(){return 18;};}catch(e){}function dock1(){return docks.find(function(d){return String(d.name||d.id)==="1";});}function zoom(f){try{scale=Math.max(0.04,Math.min(18,(scale||1)*f));applyZoom();}catch(e){}}function showMap(){document.body.classList.add("map-only");document.body.classList.remove("panel-open");try{closeEditPanel();}catch(e){}try{fitWholeMap();}catch(e){}}function sync(){var on=document.body.classList.contains("editing");document.getElementById("always-edit").textContent=on?"Done editing":"Edit docks";["always-split","always-walk"].forEach(function(id){document.getElementById(id).style.display=on?"block":"none";});document.getElementById("sel-name").style.display=on?"block":"none";}document.addEventListener("click",function(ev){var mapBtn=ev.target.closest&&ev.target.closest("#btn-sheet-close");if(!mapBtn)return;ev.preventDefault();ev.stopPropagation();showMap();},true);document.getElementById("show-panel").onclick=function(e){e.preventDefault();e.stopPropagation();document.body.classList.remove("map-only");};document.getElementById("always-zin").onclick=function(e){e.preventDefault();e.stopPropagation();zoom(1.7);};document.getElementById("always-zout").onclick=function(e){e.preventDefault();e.stopPropagation();zoom(0.6);};document.getElementById("always-split").onclick=function(e){e.preventDefault();e.stopPropagation();var d=dock1();if(!d)return;d.locked=false;try{bakeDockPlaced(d);multi.clear();setMultiPick(false);saveLayout();redraw();}catch(err){}alert("Dock 1 slips are detached.");};document.getElementById("always-walk").onclick=function(e){e.preventDefault();e.stopPropagation();var d=dock1();if(!d)return;var sw=Number(d.sw)||90,sh=Number(d.sh)||40,g=Number(d.gap)||3,n=Math.max((d.a||[]).length,(d.b||[]).length,1),m=marks.find(function(item){return item.title==="Dock 1 walkway";});if(!m){m={id:"walk-dock1-"+Date.now(),kind:"bar",title:"Dock 1 walkway"};marks.push(m);}m.x=(Number(d.x)||0)+sw;m.y=Number(d.y)||0;m.w=16;m.h=n*(sh+g)-g;try{saveLayout();redraw();}catch(err){}alert("Walkway is between the two rows.");};document.getElementById("always-edit").onclick=function(e){e.preventDefault();e.stopPropagation();if(document.body.classList.contains("editing")){document.getElementById("edit-toggle").click();document.body.classList.remove("editing","panel-open");document.documentElement.classList.remove("editing");showMap();}else{document.body.classList.remove("map-only");document.getElementById("edit-toggle").click();}sync();};setTimeout(function(){try{fitWholeMap();}catch(e){}},400);sync();})();<\/script></body>');
  document.open();document.write(html);document.close();
}).catch(function(){document.getElementById("s").textContent="Could not open the edit chart.";});
</script>
</body>
</html>
