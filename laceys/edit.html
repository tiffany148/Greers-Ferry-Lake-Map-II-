<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover"/>
<title>Lacey's Narrows (editable)</title>
<style>html,body{margin:0;background:#0c3c41;color:#eef4f3;font-family:-apple-system,sans-serif}</style>
</head>
<body><p id="s">Loading the edit chart…</p>
<script>
fetch("https://raw.githubusercontent.com/tiffany148/Greers-Ferry-Lake-Map-II-/e278feea94/laceys/index.html").then(function(r){return r.text();}).then(function(html){
  html=html.replace('viewport-fit=cover','viewport-fit=cover, user-scalable=yes');
  html=html.replace('</head>','<style>.chart{height:50dvh!important;min-height:280px!important;overflow:hidden!important;touch-action:none!important}body.map-only:not(.editing) aside,body.map-only:not(.editing) .photo-op,body.map-only:not(.editing) .photo-align,body.map-only:not(.editing) .label-size-bar,body.map-only:not(.editing) .search,body.map-only:not(.editing) .chips{display:none!important}body.map-only:not(.editing) .chart{height:88dvh!important}body.editing aside{display:block!important;position:relative!important;transform:none!important;pointer-events:auto!important;max-height:42dvh!important;overflow:auto!important}#show-tools{display:none;position:fixed;z-index:100001;left:8px;top:8px;border:0;border-radius:12px;padding:12px 14px;background:#d5ecea;color:#0c3c41;font-weight:800}body.map-only:not(.editing) #show-tools{display:block}#bar{position:fixed;z-index:100000;left:8px;right:8px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px;justify-content:center}#bar button{border:0;border-radius:12px;padding:12px 10px;font-weight:800;background:#d5ecea;color:#0c3c41}#always-edit{background:#f0c14b}#always-del{background:#8a3a3a;color:#fff}#sel-name{position:fixed;z-index:99999;top:8px;left:8px;right:8px;background:#1a5c62;color:#fff;border-radius:12px;padding:8px 10px;font-weight:800}</style></head>');
  html=html.replace('</body>','<button id="show-tools" type="button">Show tools</button><div id="sel-name">Tap a dock, then Delete</div><div id="bar"><button type="button" id="always-undo">Undo</button><button type="button" id="always-redo">Redo</button><button type="button" id="always-zin">+</button><button type="button" id="always-zout">-</button><button type="button" id="always-del">Delete</button><button type="button" id="always-edit">Edit docks</button></div><script>(function(){function note(t){document.getElementById("sel-name").textContent=t;}function zoom(f){try{if(typeof scale!=="number")scale=1;scale=Math.max(0.05,Math.min(16,scale*f));applyZoom();}catch(e){}}function showMap(){if(document.body.classList.contains("editing"))return;document.body.classList.add("map-only");try{fitWholeMap();}catch(e){}note("Map only. Show tools brings the bars back.");}function openTools(){document.body.classList.remove("map-only");document.body.classList.add("panel-open");var aside=document.querySelector("aside");if(aside)aside.style.display="block";try{openEditPanel();}catch(e){}note("Tools open");}function label(){var names=[];try{if(selectedDock){var d=docks.find(function(x){return x.id===selectedDock;});if(d)names.push("Dock "+d.name);}if(selected){var s=slips.find(function(x){return String(x.id)===String(selected);});if(s)names.push("Slip "+s.num);}if(selectedMark){var m=marks.find(function(x){return x.id===selectedMark;});if(m)names.push(m.title||"Walkway");}}catch(e){}if(names.length)note(names.join(" | "));}function del(){try{if(selectedDock){var i=docks.findIndex(function(x){return x.id===selectedDock;});if(i<0){note("Dock not found");return;}var name=docks[i].name;docks.splice(i,1);selectedDock=null;selected=null;saveLayout();redraw();note("Deleted dock "+name);return;}if(selectedMark){var j=marks.findIndex(function(m){return m.id===selectedMark;});if(j<0)return;marks.splice(j,1);selectedMark=null;saveLayout();redraw();note("Deleted");return;}note("Tap the dock on the map first, then Delete.");}catch(e){note("Delete failed");}}document.getElementById("show-tools").onclick=function(e){e.preventDefault();e.stopPropagation();openTools();};document.getElementById("always-zin").onclick=function(e){e.preventDefault();e.stopPropagation();zoom(1.6);};document.getElementById("always-zout").onclick=function(e){e.preventDefault();e.stopPropagation();zoom(0.62);};document.getElementById("always-undo").onclick=function(e){e.preventDefault();e.stopPropagation();try{undo();note("Undone");}catch(err){note("Nothing to undo");}};document.getElementById("always-redo").onclick=function(e){e.preventDefault();e.stopPropagation();try{redo();note("Redone");}catch(err){}};document.getElementById("always-del").onclick=function(e){e.preventDefault();e.stopPropagation();del();};document.getElementById("always-edit").onclick=function(e){e.preventDefault();e.stopPropagation();var t=document.getElementById("edit-toggle");if(t)t.click();var on=document.body.classList.contains("editing");document.getElementById("always-edit").textContent=on?"Done":"Edit docks";if(on)openTools();else showMap();label();};document.addEventListener("click",function(ev){var mapBtn=ev.target.closest&&ev.target.closest("#btn-sheet-close");if(mapBtn){ev.preventDefault();ev.stopPropagation();showMap();return;}setTimeout(label,40);},true);setTimeout(function(){try{fitWholeMap();}catch(e){}},300);})();<\/script></body>');
  document.open();document.write(html);document.close();
}).catch(function(){document.getElementById("s").textContent="Could not open the edit chart.";});
</script></body></html>
