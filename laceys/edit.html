<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover"/>
<title>Lacey's Narrows (editable)</title>
<style>html,body{margin:0;background:#0c3c41;color:#eef4f3;font-family:-apple-system,system-ui,sans-serif}p{padding:24px}a{color:#d5ecea}</style>
</head>
<body>
<p id="s">Loading the edit chart…</p>
<script>
fetch("https://raw.githubusercontent.com/tiffany148/Greers-Ferry-Lake-Map-II-/e278feea94/laceys/index.html")
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
  .then(function(html){
    if(html.indexOf("edit-toggle")===-1) throw new Error("not editor");
    html = html.replace('content="width=device-width, initial-scale=1, viewport-fit=cover"','content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover"');
    html = html.replace('</head>',
      '<style id="page-scroll">'
      + 'html,body,html.editing,body.editing{overflow:auto!important;height:auto!important;min-height:100%!important;max-height:none!important;position:static!important;touch-action:pan-y!important}'
      + '.map-stage,.layout,body.editing .layout{position:relative!important;overflow:visible!important;height:auto!important;top:auto!important}'
      + 'body.editing .chart{position:relative!important;height:46dvh!important;touch-action:none!important}'
      + 'body:not(.editing) .chart{position:relative!important;height:52dvh!important;touch-action:pan-y!important}'
      + 'body.screen-clear .photo-align,body.screen-clear .photo-op,body.screen-clear .label-size-bar,body.screen-clear #edit-chrome,body.screen-clear aside,body.screen-clear #edit-fabs,body.screen-clear #sel-tools,body.screen-clear .edit-banner{display:none!important}'
      + '#always-edit,#always-zoom,#always-pick{position:fixed;z-index:99999;top:8px;border:0;border-radius:12px;padding:10px 12px;font-weight:800;font-size:14px}'
      + '#always-edit{left:8px;background:#f0c14b;color:#1a1a1a}'
      + '#always-zoom{left:128px;background:#d5ecea;color:#0c3c41}'
      + '#always-pick{right:8px;background:#7ec8ff;color:#0a1a28}'
      + '#always-undo,#always-redo,#always-lock,#always-unlock,#always-sep,#always-walk{position:fixed;z-index:99999;border:0;border-radius:12px;padding:11px 12px;font-weight:800;font-size:14px}'
      + '#always-undo{bottom:108px;left:8px;background:#d5ecea;color:#0c3c41}#always-redo{bottom:108px;left:86px;background:#d5ecea;color:#0c3c41}'
      + '#always-lock{bottom:60px;left:8px;background:#f0c14b;color:#1a1a1a}#always-unlock{bottom:60px;right:8px;background:#15565b;color:#eef4f3}'
      + '#always-sep{bottom:12px;left:8px;background:#7ec8ff;color:#0a1a28}#always-walk{bottom:12px;right:8px;background:#f4a261;color:#1a1a1a}'
      + '#pick-list.big-pick{display:block!important;position:fixed;left:8px;right:8px;top:58px;bottom:150px;z-index:99997;max-height:none;background:#0a3338;border-radius:14px;padding:8px}'
      + '#pick-list.big-pick .pick-row{min-height:56px;font-size:18px;padding:14px}'
      + '#sel-tools{display:none;position:fixed;top:54px;left:8px;right:8px;z-index:99998;background:rgba(10,51,56,.96);color:#eef4f3;border-radius:12px;padding:8px}'
      + '#sel-tools .row{display:flex;gap:6px;flex-wrap:wrap}#sel-tools input{width:64px;border:0;border-radius:8px;padding:6px;background:#15565b;color:#eef4f3}'
      + '</style></head>');
    html = html.replace('</body>',
      '<button type="button" id="always-edit">Edit docks</button><button type="button" id="always-zoom">Zoom in</button><button type="button" id="always-pick">Pick slips</button>'
      + '<button type="button" id="always-undo">Undo</button><button type="button" id="always-redo">Redo</button>'
      + '<button type="button" id="always-lock">Lock all</button><button type="button" id="always-unlock">Unlock selected</button>'
      + '<button type="button" id="always-sep">Separate 1 and 2</button><button type="button" id="always-walk">Detach dock 1 walkway</button>'
      + '<div id="sel-tools"><div class="row"><label>X<input id="st-x" type="number"></label><label>Y<input id="st-y" type="number"></label><label>Rotate<input id="st-rot" type="number"></label><label>Scale W<input id="st-w" type="number"></label><label>Scale H<input id="st-h" type="number"></label></div></div>'
      + '<script>(function(){'
      + 'try{ maxZoomScale=function(){ return 18; }; }catch(e){}'
      + 'function stopSelecting(){ try{ if(typeof setMultiPick==="function") setMultiPick(false);}catch(e){} try{ if(typeof multi!=="undefined"&&multi.clear) multi.clear(); }catch(e){} try{ moveWholeChart=false; }catch(e){} document.body.classList.remove("multipick","sel-active"); var box=document.getElementById("pick-list"); if(box){ box.classList.remove("big-pick"); box.hidden=true; } }'
      + 'function hideBars(){ ["photo-align-bar","photo-op-bar","label-size-bar","edit-chrome","edit-fabs","sel-tools"].forEach(function(id){ var el=document.getElementById(id); if(el) el.style.display="none"; }); document.body.classList.add("screen-clear"); }'
      + 'function lockAll(){ docks.forEach(function(d){ d.locked=true; try{ bakeDockPlaced(d);}catch(e){} }); try{ saveLayout(); redraw(); }catch(e){} alert("All docks locked."); }'
      + 'function unlockSelected(){ try{ if(typeof ungroupUnlockThisDock==="function"){ ungroupUnlockThisDock(); return; } }catch(e){} alert("Tap the dock first, then Unlock selected."); }'
      + 'function separate12(){ var want=docks.filter(function(d){ var n=String(d.name||d.id).trim(); return n==="1"||n==="2"||String(d.id)==="1"||String(d.id)==="2"; }); want.forEach(function(d){ d.locked=false; try{ bakeDockPlaced(d);}catch(e){} }); if(typeof groups!=="undefined") groups=groups.filter(function(g){ return !(g.members||[]).some(function(k){ return want.some(function(d){ return k==="dock:"+d.id; }); }); }); stopSelecting(); try{ saveLayout(); redraw(); }catch(e){} alert("Docks 1 and 2 are separate."); }'
      + 'function detachWalk(){ var d1=docks.find(function(d){ return String(d.name||d.id).trim()==="1"||String(d.id)==="1"; }); if(!d1){ alert("Could not find dock 1."); return; } d1.locked=false; try{ bakeDockPlaced(d1);}catch(e){} var walks=(marks||[]).filter(function(m){ return m.kind==="bar"||/walk/i.test(m.title||m.id||""); }); if(typeof groups!=="undefined") groups=groups.filter(function(g){ var mem=g.members||[]; return !(mem.indexOf("dock:"+d1.id)>=0 && mem.some(function(k){ return walks.some(function(w){ return k==="mark:"+w.id; }); })); }); stopSelecting(); try{ saveLayout(); redraw(); }catch(e){} alert("Dock 1 is detached from its walkway."); }'
      + 'function exitToMap(){ stopSelecting(); if(document.body.classList.contains("editing")){ var t=document.getElementById("edit-toggle"); if(t) t.click(); } document.body.classList.remove("editing","panel-open","photo-moving","stretch-open","photo-tools-open"); document.documentElement.classList.remove("editing"); try{ closeEditPanel(); fitWholeMap(); }catch(e){} hideBars(); sync(); window.scrollTo(0,0); }'
      + 'function pickSlips(){ if(!document.body.classList.contains("editing")){ var t=document.getElementById("edit-toggle"); if(t) t.click(); } document.body.classList.remove("screen-clear"); try{ setMultiPick(true); }catch(e){} try{ openEditPanel(); }catch(e){} var box=document.getElementById("pick-list"); if(box){ box.hidden=false; box.classList.add("big-pick"); } alert("Tick slips in the list. Do not tap the map."); }'
      + 'function zoomIn(){ var c=document.getElementById("chart"); try{ zoomToward(c.clientWidth/2, c.clientHeight/2, 1.8); }catch(e){ var z=document.getElementById("z-in"); if(z) z.click(); } }'
      + 'var chart=document.getElementById("chart"); if(chart) chart.addEventListener("pointerdown", function(ev){ if(!document.body.classList.contains("editing")||document.body.classList.contains("multipick")) ev.stopPropagation(); }, true);'
      + 'var b=document.getElementById("always-edit"), z=document.getElementById("always-zoom"), p=document.getElementById("always-pick"), u=document.getElementById("always-undo"), r=document.getElementById("always-redo"), lock=document.getElementById("always-lock"), un=document.getElementById("always-unlock"), sep=document.getElementById("always-sep"), walk=document.getElementById("always-walk"), bar=document.getElementById("sel-tools");'
      + 'function sync(){ var on=document.body.classList.contains("editing"); b.textContent=on?"Done editing":"Edit docks"; [u,r,lock,un,sep,walk,p].forEach(function(el){ el.style.display=on?"block":"none"; }); if(!on){ bar.style.display="none"; document.body.classList.add("screen-clear"); } else document.body.classList.remove("screen-clear"); }'
      + 'function setVal(id,v){ var el=document.getElementById(id); if(!el) return; el.value=v; el.dispatchEvent(new Event("input",{bubbles:true})); el.dispatchEvent(new Event("change",{bubbles:true})); }'
      + 'function readSel(){ if(!document.body.classList.contains("editing")||document.getElementById("pick-list").classList.contains("big-pick")){ bar.style.display="none"; return; } var x=document.getElementById("ed-x"), y=document.getElementById("ed-y"); if(!x&&!y){ bar.style.display="none"; return; } bar.style.display="block"; if(x) document.getElementById("st-x").value=x.value; if(y) document.getElementById("st-y").value=y.value; }'
      + 'function push(id,src){ var el=document.getElementById(src); if(el) setVal(id, el.value); }'
      + 'document.getElementById("st-x").onchange=function(){ push("ed-x","st-x"); }; document.getElementById("st-y").onchange=function(){ push("ed-y","st-y"); }; document.getElementById("st-rot").onchange=function(){ push("ed-rot-num","st-rot"); }; document.getElementById("st-w").onchange=function(){ if(document.getElementById("ed-sw")) push("ed-sw","st-w"); else push("ed-w","st-w"); }; document.getElementById("st-h").onchange=function(){ if(document.getElementById("ed-sh")) push("ed-sh","st-h"); else push("ed-h","st-h"); };'
      + 'u.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); try{ undo(); }catch(e){} };'
      + 'r.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); try{ redo(); }catch(e){} };'
      + 'z.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); zoomIn(); };'
      + 'p.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); pickSlips(); };'
      + 'lock.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); lockAll(); };'
      + 'un.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); unlockSelected(); };'
      + 'sep.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); separate12(); };'
      + 'walk.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); detachWalk(); };'
      + 'b.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); if(document.body.classList.contains("editing")) exitToMap(); else { document.body.classList.remove("screen-clear"); var t=document.getElementById("edit-toggle"); if(t) t.click(); sync(); } };'
      + 'document.addEventListener("click", function(ev){ var mapBtn=ev.target.closest&&ev.target.closest("#btn-sheet-close,#edit-fab-done,#edit-toggle-mobile"); if(!mapBtn) return; ev.preventDefault(); ev.stopPropagation(); if(mapBtn.id==="btn-sheet-close"){ try{ closeEditPanel(); }catch(e){} document.body.classList.remove("panel-open"); hideBars(); return; } exitToMap(); }, true);'
      + 'setInterval(function(){ if(document.body.classList.contains("editing")) readSel(); }, 800); sync();'
      + '})();<\/script></body>');
    document.open(); document.write(html); document.close();
  })
  .catch(function(){ document.getElementById("s").innerHTML='Could not open the edit chart.'; });
</script>
</body>
</html>
