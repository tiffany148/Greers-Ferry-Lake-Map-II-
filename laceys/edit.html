<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover"/>
<title>Lacey's Narrows (editable)</title>
<style>html,body{margin:0;background:#0c3c41;color:#eef4f3;font-family:-apple-system,system-ui,sans-serif}p{padding:24px}a{color:#d5ecea}</style>
</head>
<body>
<p id="s">Loading the edit chart…</p>
<script>
fetch("https://raw.githubusercontent.com/tiffany148/Greers-Ferry-Lake-Map-II-/e278feea94/laceys/index.html")
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
  .then(function(html){
    if(html.indexOf("edit-toggle")===-1) throw new Error("not editor");
    html = html.replace('content="width=device-width, initial-scale=1, viewport-fit=cover"','content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover"');
    html = html.replace('</head>',
      '<style id="page-scroll">'
      + 'html,body{overflow:auto!important;height:auto!important;position:static!important}'
      + '.chart{position:relative!important;height:62dvh!important;min-height:320px!important;max-height:70dvh!important;overflow:hidden!important}'
      + 'body.editing .chart{touch-action:none!important}'
      + 'body.screen-clear .photo-align,body.screen-clear .photo-op,body.screen-clear .label-size-bar,body.screen-clear #edit-chrome,body.screen-clear aside,body.screen-clear #edit-fabs{display:none!important}'
      + '#sel-name{display:none;position:fixed;top:52px;left:8px;right:8px;z-index:99999;background:#1a5c62;color:#fff;border-radius:12px;padding:10px 12px;font-weight:800}'
      + '#always-edit,#always-zoom,#always-pick{position:fixed;z-index:99999;top:8px;border:0;border-radius:12px;padding:10px 12px;font-weight:800}'
      + '#always-edit{left:8px;background:#f0c14b;color:#1a1a1a}#always-zoom{left:128px;background:#d5ecea;color:#0c3c41}#always-pick{right:8px;background:#7ec8ff;color:#0a1a28}'
      + '#always-undo,#always-redo,#always-lock,#always-unlock,#always-sep,#always-walk{position:fixed;z-index:99999;border:0;border-radius:12px;padding:11px 12px;font-weight:800}'
      + '#always-undo{bottom:108px;left:8px;background:#d5ecea;color:#0c3c41}#always-redo{bottom:108px;left:86px;background:#d5ecea;color:#0c3c41}'
      + '#always-lock{bottom:60px;left:8px;background:#f0c14b;color:#1a1a1a}#always-unlock{bottom:60px;right:8px;background:#15565b;color:#eef4f3}'
      + '#always-sep{bottom:12px;left:8px;background:#7ec8ff;color:#0a1a28}#always-walk{bottom:12px;right:8px;background:#f4a261;color:#1a1a1a}'
      + '</style></head>');
    html = html.replace('</body>',
      '<button type="button" id="always-edit">Edit docks</button><button type="button" id="always-zoom">Zoom in</button><button type="button" id="always-pick">Pick slips</button>'
      + '<div id="sel-name">Nothing selected</div>'
      + '<button type="button" id="always-undo">Undo</button><button type="button" id="always-redo">Redo</button>'
      + '<button type="button" id="always-lock">Lock all</button><button type="button" id="always-unlock">Unlock selected</button>'
      + '<button type="button" id="always-sep">Separate 1 and 2</button><button type="button" id="always-walk">Detach dock 1 walkway</button>'
      + '<script>(function(){'
      + 'try{ maxZoomScale=function(){ return 18; }; }catch(e){}'
      + 'function fit(){ try{ fitWholeMap(); }catch(e){} var z=document.getElementById("z-full"); if(z) z.click(); }'
      + 'function selectionText(){ var names=[]; try{ if(typeof multi!=="undefined" && multi.forEach){ multi.forEach(function(k){ var i=String(k).indexOf(":"); var kind=String(k).slice(0,i), id=String(k).slice(i+1); if(kind==="slip"){ var s=(slips||[]).find(function(x){ return String(x.id)===id; }); names.push("Slip "+(s&&s.num||id)); } else if(kind==="dock"){ var d=(docks||[]).find(function(x){ return String(x.id)===id; }); names.push("Dock "+(d&&d.name||id)); } else { var m=(marks||[]).find(function(x){ return String(x.id)===id; }); names.push((m&&(m.title||m.kind))||"Building"); } }); } }catch(e){} if(!names.length && typeof selectedDock!=="undefined" && selectedDock){ var d2=(docks||[]).find(function(x){ return String(x.id)===String(selectedDock); }); if(d2) names.push("Dock "+d2.name); } if(!names.length && typeof selected!=="undefined" && selected){ var s2=(slips||[]).find(function(x){ return String(x.id)===String(selected); }); if(s2) names.push("Slip "+s2.num); } if(!names.length && typeof selectedMark!=="undefined" && selectedMark){ var m2=(marks||[]).find(function(x){ return String(x.id)===String(selectedMark); }); if(m2) names.push(m2.title||m2.kind||"Building"); } return names.length?names.join(", "):"Nothing selected"; }'
      + 'function showSel(){ var el=document.getElementById("sel-name"); if(!document.body.classList.contains("editing")){ el.style.display="none"; return; } el.style.display="block"; el.textContent=selectionText(); }'
      + 'function stopSelecting(){ try{ setMultiPick(false);}catch(e){} try{ multi.clear(); }catch(e){} try{ moveWholeChart=false; }catch(e){} showSel(); }'
      + 'function exitToMap(){ stopSelecting(); if(document.body.classList.contains("editing")){ var t=document.getElementById("edit-toggle"); if(t) t.click(); } document.body.classList.remove("editing","panel-open"); document.documentElement.classList.remove("editing"); document.body.classList.add("screen-clear"); try{ closeEditPanel(); }catch(e){} fit(); sync(); }'
      + 'function sync(){ var on=document.body.classList.contains("editing"); document.getElementById("always-edit").textContent=on?"Done editing":"Edit docks"; ["always-undo","always-redo","always-lock","always-unlock","always-sep","always-walk","always-pick"].forEach(function(id){ document.getElementById(id).style.display=on?"block":"none"; }); if(!on) document.getElementById("sel-name").style.display="none"; else document.body.classList.remove("screen-clear"); showSel(); }'
      + 'document.getElementById("always-zoom").onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); var c=document.getElementById("chart"); try{ zoomToward(c.clientWidth/2,c.clientHeight/2,1.8);}catch(e){} };'
      + 'document.getElementById("always-pick").onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); if(!document.body.classList.contains("editing")) document.getElementById("edit-toggle").click(); try{ setMultiPick(true);}catch(e){} var box=document.getElementById("pick-list"); if(box){ box.hidden=false; box.style.cssText="display:block;position:fixed;left:8px;right:8px;top:100px;bottom:150px;z-index:99997;background:#0a3338;overflow:auto"; } showSel(); };'
      + 'document.getElementById("always-lock").onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); docks.forEach(function(d){ d.locked=true; try{ bakeDockPlaced(d);}catch(e){} }); try{ saveLayout(); redraw(); }catch(e){} alert("All docks locked."); };'
      + 'document.getElementById("always-unlock").onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); try{ ungroupUnlockThisDock(); }catch(e){ alert("Tap the dock first."); } showSel(); };'
      + 'document.getElementById("always-sep").onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); docks.filter(function(d){ return String(d.name)==="1"||String(d.name)==="2"; }).forEach(function(d){ d.locked=false; try{ bakeDockPlaced(d);}catch(e){} }); stopSelecting(); try{ saveLayout(); redraw(); }catch(e){} alert("Docks 1 and 2 are separate."); };'
      + 'document.getElementById("always-walk").onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); var d1=docks.find(function(d){ return String(d.name)==="1"; }); if(d1){ d1.locked=false; try{ bakeDockPlaced(d1);}catch(e){} } if(typeof groups!=="undefined") groups=groups.filter(function(g){ return (g.members||[]).indexOf("dock:"+(d1&&d1.id))<0; }); stopSelecting(); try{ saveLayout(); redraw(); }catch(e){} alert("Dock 1 walkway detached."); };'
      + 'document.getElementById("always-undo").onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); try{ undo(); }catch(e){} showSel(); };'
      + 'document.getElementById("always-redo").onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); try{ redo(); }catch(e){} showSel(); };'
      + 'document.getElementById("always-edit").onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); if(document.body.classList.contains("editing")) exitToMap(); else { document.body.classList.remove("screen-clear"); document.getElementById("edit-toggle").click(); sync(); } };'
      + 'document.addEventListener("click", function(){ setTimeout(showSel, 40); }, true);'
      + 'setInterval(function(){ if(document.body.classList.contains("editing")) showSel(); }, 600);'
      + 'setTimeout(fit, 400); sync();'
      + '})();<\/script></body>');
    document.open(); document.write(html); document.close();
  })
  .catch(function(){ document.getElementById("s").innerHTML='Could not open the edit chart.'; });
</script>
</body>
</html>
