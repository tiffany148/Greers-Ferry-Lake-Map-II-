<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover"/>
<title>Lacey's Narrows (editable)</title>
<style>html,body{margin:0;background:#0c3c41;color:#eef4f3;font-family:-apple-system,system-ui,sans-serif}p{padding:24px}a{color:#d5ecea}</style>
</head>
<body>
<p id="s">Loading the edit chart…</p>
<script>
fetch("https://raw.githubusercontent.com/tiffany148/Greers-Ferry-Lake-Map-II-/e278feea94/laceys/index.html")
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
  .then(function(html){
    if(html.indexOf("edit-toggle")===-1) throw new Error("not editor");
    html = html.replace(
      'content="width=device-width, initial-scale=1, viewport-fit=cover"',
      'content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover"'
    );
    html = html.replace('</head>',
      '<style id="page-scroll">'
      + 'html,body{overflow:auto!important;overflow-x:hidden!important;height:auto!important;min-height:100%!important;max-height:none!important;position:static!important;touch-action:pan-y!important}'
      + 'header,.search,.chips,.photo-op,.photo-align,.label-size-bar{position:relative!important;top:auto!important}'
      + '.map-stage{overflow:visible!important;height:auto!important;flex:none!important;position:relative!important}'
      + '.layout{position:relative!important;height:auto!important;min-height:0!important;top:auto!important;bottom:auto!important}'
      + 'body.editing .chart{touch-action:none!important;min-height:58dvh!important;height:58dvh!important}'
      + 'body:not(.editing) .chart{touch-action:pan-y!important;position:relative!important;inset:auto!important;height:52dvh!important;min-height:52dvh!important;width:100%!important}'
      + 'body:not(.editing) .layout,body:not(.editing) .map-stage{position:relative!important;height:auto!important}'
      + '#always-edit,#always-stop,#always-undo,#always-redo{position:fixed;z-index:99999;border:0;border-radius:12px;padding:10px 12px;font-weight:800;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.4)}'
      + '#always-edit{top:8px;left:8px;background:#f0c14b;color:#1a1a1a}'
      + '#always-stop{top:8px;right:8px;background:#15565b;color:#eef4f3}'
      + '#always-undo{top:54px;left:8px;background:#d5ecea;color:#0c3c41}'
      + '#always-redo{top:54px;left:92px;background:#d5ecea;color:#0c3c41}'
      + '#sel-tools{display:none;position:fixed;top:98px;left:8px;right:8px;z-index:99998;background:rgba(10,51,56,.96);color:#eef4f3;border-radius:12px;padding:8px;box-shadow:0 6px 16px rgba(0,0,0,.4)}'
      + '#sel-tools b{display:block;font-size:12px;margin-bottom:6px}'
      + '#sel-tools .row{display:flex;gap:6px;flex-wrap:wrap}'
      + '#sel-tools label{font-size:11px;display:flex;flex-direction:column;gap:2px}'
      + '#sel-tools input{width:64px;border:0;border-radius:8px;padding:6px;background:#15565b;color:#eef4f3}'
      + 'body.editing #dock-editor{display:flex;flex-direction:column}'
      + 'body.editing #dock-editor .ed-sec{order:-1}'
      + '</style></head>'
    );
    html = html.replace('</body>',
      '<button type="button" id="always-edit">Edit docks</button>'
      + '<button type="button" id="always-stop">Stop selecting</button>'
      + '<button type="button" id="always-undo">Undo</button>'
      + '<button type="button" id="always-redo">Redo</button>'
      + '<div id="sel-tools"><b id="sel-tools-title">Selected</b><div class="row">'
      + '<label>X<input id="st-x" type="number" inputmode="decimal"></label>'
      + '<label>Y<input id="st-y" type="number" inputmode="decimal"></label>'
      + '<label>Rotate<input id="st-rot" type="number" inputmode="decimal"></label>'
      + '<label>Scale W<input id="st-w" type="number" inputmode="decimal"></label>'
      + '<label>Scale H<input id="st-h" type="number" inputmode="decimal"></label>'
      + '</div></div>'
      + '<script>'
      + '(function(){'
      + 'function stopSelecting(){'
      + '  try{ if(typeof setMultiPick==="function") setMultiPick(false); }catch(e){}'
      + '  try{ if(typeof multi!=="undefined" && multi.clear) multi.clear(); }catch(e){}'
      + '  try{ moveWholeChart=false; }catch(e){}'
      + '  document.body.classList.remove("multipick","sel-active");'
      + '}'
      + 'function showFullMap(){'
      + '  document.body.classList.remove("panel-open","browse-map","editing");'
      + '  document.documentElement.classList.remove("editing");'
      + '  try{ if(typeof closeEditPanel==="function") closeEditPanel(); }catch(e){}'
      + '  try{ if(typeof fitWholeMap==="function") fitWholeMap(); }catch(e){}'
      + '  var bar=document.getElementById("sel-tools"); if(bar) bar.style.display="none";'
      + '  window.scrollTo(0,0);'
      + '}'
      + 'function exitToMap(){'
      + '  stopSelecting();'
      + '  if(document.body.classList.contains("editing")){'
      + '    var t=document.getElementById("edit-toggle");'
      + '    if(t) t.click();'
      + '  }'
      + '  document.body.classList.remove("editing","panel-open","multipick","sel-active","stretch-open","photo-tools-open");'
      + '  document.documentElement.classList.remove("editing");'
      + '  var chart=document.getElementById("chart"); if(chart) chart.classList.remove("editing");'
      + '  var et=document.getElementById("edit-toggle"); if(et){ et.classList.remove("on"); et.textContent="Edit docks"; }'
      + '  showFullMap();'
      + '  sync();'
      + '}'
      + 'var chart=document.getElementById("chart");'
      + 'if(chart){'
      + '  chart.addEventListener("pointerdown", function(ev){'
      + '    if(!document.body.classList.contains("editing")){ ev.stopPropagation(); }'
      + '  }, true);'
      + '}'
      + 'var b=document.getElementById("always-edit");'
      + 'var s=document.getElementById("always-stop");'
      + 'var u=document.getElementById("always-undo");'
      + 'var r=document.getElementById("always-redo");'
      + 'var bar=document.getElementById("sel-tools");'
      + 'function sync(){'
      + '  var on=document.body.classList.contains("editing");'
      + '  b.textContent=on?"Done editing":"Edit docks";'
      + '  u.style.display=on?"block":"none";'
      + '  r.style.display=on?"block":"none";'
      + '  s.style.display=on?"block":"none";'
      + '  if(!on) bar.style.display="none";'
      + '}'
      + 'function setVal(id,v){ var el=document.getElementById(id); if(!el) return; el.value=v; el.dispatchEvent(new Event("input",{bubbles:true})); el.dispatchEvent(new Event("change",{bubbles:true})); }'
      + 'function readSel(){'
      + '  if(!document.body.classList.contains("editing")){ bar.style.display="none"; return; }'
      + '  var x=document.getElementById("ed-x"), y=document.getElementById("ed-y"), rot=document.getElementById("ed-rot-num")||document.getElementById("ed-rot");'
      + '  var w=document.getElementById("ed-sw")||document.getElementById("ed-w");'
      + '  var h=document.getElementById("ed-sh")||document.getElementById("ed-h");'
      + '  if(!x && !y){ bar.style.display="none"; return; }'
      + '  bar.style.display="block";'
      + '  if(x) document.getElementById("st-x").value=x.value;'
      + '  if(y) document.getElementById("st-y").value=y.value;'
      + '  if(rot) document.getElementById("st-rot").value=rot.value;'
      + '  if(w) document.getElementById("st-w").value=w.value;'
      + '  if(h) document.getElementById("st-h").value=h.value;'
      + '  var box=document.getElementById("dock-editor");'
      + '  var sec=box&&box.querySelector(".ed-sec");'
      + '  if(box&&sec) box.insertBefore(sec, box.firstChild);'
      + '}'
      + 'function push(id, src){ var el=document.getElementById(src); if(el) setVal(id, el.value); }'
      + 'document.getElementById("st-x").onchange=function(){ push("ed-x","st-x"); };'
      + 'document.getElementById("st-y").onchange=function(){ push("ed-y","st-y"); };'
      + 'document.getElementById("st-rot").onchange=function(){ push("ed-rot-num","st-rot"); push("ed-rot","st-rot"); };'
      + 'document.getElementById("st-w").onchange=function(){ if(document.getElementById("ed-sw")) push("ed-sw","st-w"); else push("ed-w","st-w"); };'
      + 'document.getElementById("st-h").onchange=function(){ if(document.getElementById("ed-sh")) push("ed-sh","st-h"); else push("ed-h","st-h"); };'
      + 's.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); stopSelecting(); try{ redraw(); }catch(e){} };'
      + 'u.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); try{ undo(); }catch(e){} };'
      + 'r.onclick=function(ev){ ev.preventDefault(); ev.stopPropagation(); try{ redo(); }catch(e){} };'
      + 'b.onclick=function(ev){'
      + '  ev.preventDefault(); ev.stopPropagation();'
      + '  if(document.body.classList.contains("editing")) exitToMap();'
      + '  else { var t=document.getElementById("edit-toggle"); if(t) t.click(); sync(); }'
      + '};'
      + 'document.addEventListener("click", function(ev){'
      + '  var mapBtn=ev.target.closest && ev.target.closest("#btn-sheet-close,#edit-fab-done,#edit-toggle-mobile");'
      + '  if(!mapBtn) return;'
      + '  ev.preventDefault(); ev.stopPropagation();'
      + '  if(mapBtn.id==="btn-sheet-close"){ try{ closeEditPanel(); }catch(e){} document.body.classList.remove("panel-open"); return; }'
      + '  exitToMap();'
      + '}, true);'
      + 'if(typeof renderDockEditor==="function" && !renderDockEditor._wrapped){'
      + '  var orig=renderDockEditor;'
      + '  renderDockEditor=function(){ var out=orig.apply(this, arguments); setTimeout(readSel, 0); return out; };'
      + '  renderDockEditor._wrapped=true;'
      + '}'
      + 'setInterval(function(){ if(document.body.classList.contains("editing")) readSel(); }, 800);'
      + 'sync();'
      + '})();'
      + '<\/script></body>'
    );
    document.open();
    document.write(html);
    document.close();
  })
  .catch(function(){
    document.getElementById("s").innerHTML = 'Could not open the edit chart. <a href="../laceys-sandbox/">Open sandbox editor</a>';
  });
</script>
</body>
</html>
