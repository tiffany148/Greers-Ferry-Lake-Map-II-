<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Lacey's Narrows · slip chart</title>
<meta name="theme-color" content="#0c3c41"/>
<style>
:root{--water:#0c3c41;--ink:#eef4f3;--muted:#b7c9c7;--chip:#13494e}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--water);color:var(--ink);font-family:-apple-system,system-ui,Segoe UI,sans-serif}
header{padding:calc(10px + env(safe-area-inset-top)) 16px 4px}
.kicker{font-size:11px;letter-spacing:.16em;color:var(--muted)}
.row{display:flex;align-items:flex-end;gap:16px}
h1{margin:4px 0 0;font-size:26px;font-weight:650}
.meta{margin-left:auto;text-align:right;font-size:13px;color:var(--muted)}
.search{padding:8px 16px 0}
.search input{width:100%;border:0;border-radius:12px;padding:12px 14px;font-size:15px;background:#15565b;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px}
.chip{flex:0 0 auto;border:0;border-radius:999px;padding:8px 13px;background:var(--chip);color:var(--ink);cursor:pointer;font-size:14px}
.chip.on{background:#d5ecea;color:#0c3c41;font-weight:700}
.layout{display:grid;grid-template-columns:1.3fr 1fr;height:calc(100% - 160px);min-height:420px}
.chart{position:relative;overflow:hidden;cursor:grab;margin-left:10px;border-radius:12px;background:#0a3539}
.chart img{transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border:0;border-radius:10px;background:#fff;color:#173b3e;font-size:18px;cursor:pointer}
aside{background:#0a3338;padding:14px;overflow:auto}
.tabs{display:flex;gap:16px;margin-bottom:10px}
.tabs button{background:none;border:0;color:var(--muted);font-size:15px;padding-bottom:6px;cursor:pointer}
.tabs button.on{color:var(--ink);box-shadow:inset 0 -2px 0 #d5ecea}
aside h2{font-size:15px;margin:0 0 8px}
aside p{font-size:13px;color:var(--muted);line-height:1.45}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.slipbtn{min-width:48px;padding:8px 6px;border:0;border-radius:8px;background:#e4dcc8;color:#1c2423;font-weight:700;font-size:13px;cursor:pointer}
.slipbtn.occupied{background:#b55a32;color:#fff}
.slipbtn.reserved{background:#d7b45a}
.slipbtn.on{outline:2px solid #fff}
.pair{display:flex;flex-direction:column;gap:4px}
label{display:block;font-size:12px;color:var(--muted);margin-top:8px}
input,textarea{width:100%;border:0;border-radius:10px;padding:9px;margin-top:4px;background:#15565b;color:var(--ink);font:inherit}
.st{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.st button{border:0;border-radius:999px;padding:7px 10px;background:#15565b;color:var(--ink);cursor:pointer;font-size:12px}
.st button.on{background:#d5ecea;color:#0c3c41;font-weight:700}
.dir-item{padding:8px 0;border-bottom:1px solid #165156;font-size:13px;cursor:pointer}
@media(max-width:900px){.layout{grid-template-columns:1fr;height:auto}.chart{height:42vh;margin:0 12px}}
</style>
</head>
<body>
<header>
  <div class="kicker">GREERS FERRY LAKE · HIGDEN, AR</div>
  <div class="row">
    <h1>Lacey's Narrows</h1>
    <div class="meta"><div>Your dock map · tap a slip number</div></div>
  </div>
</header>
<div class="search"><input id="q" type="search" placeholder="Search actual slip number, e.g. 273"/></div>
<div class="chips" id="chips"></div>
<div class="layout">
  <div class="chart" id="chart">
    <img id="map" src="dock-map.jpg" alt="Lacey's Narrows dock map"/>
    <div class="zoom">
      <button id="z-in">+</button>
      <button id="z-out">−</button>
      <button id="z-full">⛶</button>
    </div>
  </div>
  <aside>
    <div class="tabs">
      <button class="on" data-tab="slip">Slips</button>
      <button data-tab="dir">Directory</button>
    </div>
    <div id="pane-slip">
      <h2 id="dock-title">All docks</h2>
      <p>Numbers are the marina slip numbers from the map, not 5-1 / 5-2. Pick a dock or type a number.</p>
      <div id="pad"></div>
      <div id="slip-detail" hidden>
        <h2 id="slip-title"></h2>
        <p id="slip-meta"></p>
        <div class="st">
          <button data-st="vacant">Vacant</button>
          <button data-st="occupied">Occupied</button>
          <button data-st="reserved">Reserved</button>
        </div>
        <label>Boat name<input id="boat"/></label>
        <label>Notes<textarea id="notes" rows="3"></textarea></label>
      </div>
    </div>
    <div id="pane-dir" hidden>
      <h2>Directory</h2>
      <div id="dir-list"></div>
    </div>
  </aside>
</div>
<script>
const STORE="laceys-slips-v4";
const load=()=>{try{return JSON.parse(localStorage.getItem(STORE)||"{}")}catch{return{}}};
const save=d=>localStorage.setItem(STORE,JSON.stringify(d));
let data=load();
const seq=(a,b)=>{const o=[];if(a<=b)for(let i=a;i<=b;i++)o.push(i);else for(let i=a;i>=b;i--)o.push(i);return o;};
function zipPairs(top,bot){return top.map((t,i)=>[t,bot[i]])}

/* Actual marina slip numbers from Tiffany's drawing */
const docks=[
  {id:"5", title:"Dock 5 · 10×30 Preferred", pairs: zipPairs(seq(282,273), seq(283,292))},
  {id:"4", title:"Dock 4 · 10×30 Preferred", pairs: zipPairs(seq(19,32), seq(14,1))},
  {id:"3", title:"Dock 3 · 10×30 Preferred", pairs: zipPairs(seq(49,64), seq(48,33))},
  {id:"2", title:"Dock 2 · 10×30 / 16×42", pairs: zipPairs(seq(261,272), seq(260,249))},
  {id:"1", title:"Dock 1 · 10×30 / 16×42", pairs: zipPairs(seq(237,248), seq(236,225))},
  {id:"7", title:"Dock 7 · 10×30", pairs: zipPairs(seq(65,80), seq(96,81))},
  {id:"8", title:"Dock 8 · 10×30", pairs: zipPairs(seq(97,112), seq(128,113))},
  {id:"9", title:"Dock 9 · 10×30", pairs: zipPairs(seq(129,144), seq(160,145))},
  {id:"10", title:"Dock 10 · 10×30", pairs: zipPairs(seq(161,176), seq(192,177))},
  {id:"11", title:"Dock 11 · 10×30", pairs: zipPairs(seq(193,208), seq(224,209))},
  {id:"12", title:"Dock 12 · 10×30", pairs: zipPairs(seq(293,308), seq(324,309))},
  {id:"13", title:"Dock 13 · 10×30", pairs: zipPairs(seq(325,340), seq(356,341))},
  {id:"Sales", title:"Sales slips · 10×34", pairs: zipPairs(seq(841,848), seq(856,849))},
  {id:"Cruiser", title:"Cruiser dock", pairs: [[800,801],[808,802],[809,803],[810,804],[811,805],[812,806],[813,807],[814,null],[815,null],[816,null]]},
  {id:"Houseboats", title:"Houseboat dock", pairs: zipPairs(seq(817,830), seq(831,838).concat([null,null,null,null,null,null]))},
  {id:"Fuel", title:"Fuel dock 20×87", pairs: [[839,840]]},
  {id:"Work boat", title:"Work boat", pairs: [["WB",null]]}
];
function allNums(){
  const o=[];
  docks.forEach(d=>d.pairs.forEach(p=>p.forEach(n=>{if(n!=null)o.push({n,dock:d.id,title:d.title})})));
  return o;
}
const NUMS=allNums();
let filter="All", selected=null;
const chips=["All","5","4","3","2","1","7","8","9","10","11","12","13","Houseboats","Cruiser","Work boat","Fuel","Sales"];
const chipsEl=document.getElementById("chips");
chips.forEach(c=>{
  const b=document.createElement("button");
  b.className="chip"+(c==="All"?" on":"");
  b.textContent=c;
  b.onclick=()=>{filter=c;[...chipsEl.children].forEach(x=>x.classList.toggle("on",x.textContent===c));renderPad();};
  chipsEl.appendChild(b);
});
function stOf(n){return (data[n]&&data[n].status)||"vacant"}
function renderPad(){
  const pad=document.getElementById("pad");
  const show=filter==="All"?docks:docks.filter(d=>d.id===filter);
  document.getElementById("dock-title").textContent = filter==="All"?"Pick a dock, then a slip number":(show[0]&&show[0].title)||filter;
  pad.innerHTML="";
  show.forEach(d=>{
    if(filter==="All"){
      const h=document.createElement("h2"); h.textContent=d.title; pad.appendChild(h);
    }
    const g=document.createElement("div"); g.className="grid";
    d.pairs.forEach(pair=>{
      const col=document.createElement("div"); col.className="pair";
      pair.forEach(n=>{
        if(n==null) return;
        const b=document.createElement("button");
        b.className="slipbtn "+stOf(n)+(String(selected)===String(n)?" on":"");
        b.textContent=n;
        b.onclick=()=>select(n,d);
        col.appendChild(b);
      });
      g.appendChild(col);
    });
    pad.appendChild(g);
  });
}
function select(n,d){
  selected=n;
  const rec=data[n]||{status:"vacant",boat:"",notes:""};
  document.getElementById("slip-detail").hidden=false;
  document.getElementById("slip-title").textContent="Slip "+n;
  document.getElementById("slip-meta").textContent=(d&&d.title)||"";
  document.getElementById("boat").value=rec.boat||"";
  document.getElementById("notes").value=rec.notes||"";
  document.querySelectorAll(".st button").forEach(b=>b.classList.toggle("on", b.dataset.st===(rec.status||"vacant")));
  showTab("slip"); renderPad(); renderDir();
}
document.querySelectorAll(".st button").forEach(b=>b.onclick=()=>{
  if(selected==null) return;
  data[selected]=data[selected]||{};
  data[selected].status=b.dataset.st; save(data); select(selected, docks.find(d=>d.pairs.some(p=>p.includes(selected)||p.includes(Number(selected)))));
});
["boat","notes"].forEach(fid=>{
  document.getElementById(fid).addEventListener("input",()=>{
    if(selected==null) return;
    data[selected]=data[selected]||{status:"vacant"};
    data[selected][fid]=document.getElementById(fid).value; save(data); renderDir();
  });
});
document.getElementById("q").addEventListener("input", function(){
  const v=this.value.trim();
  if(!v) return;
  const hit=NUMS.find(x=>String(x.n)===v);
  if(!hit) return;
  filter=hit.dock;
  [...chipsEl.children].forEach(x=>x.classList.toggle("on", x.textContent===filter));
  const d=docks.find(dd=>dd.id===hit.dock);
  select(hit.n,d);
});
function showTab(name){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===name));
  document.getElementById("pane-slip").hidden=name!=="slip";
  document.getElementById("pane-dir").hidden=name!=="dir";
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function renderDir(){
  const list=document.getElementById("dir-list");
  const rows=Object.keys(data).map(id=>({id,...data[id]})).filter(r=>r.boat||r.notes||(r.status&&r.status!=="vacant"));
  if(!rows.length){list.innerHTML="<p>No marked slips yet.</p>";return;}
  list.innerHTML=rows.map(r=>`<div class="dir-item" data-jump="${r.id}"><b>Slip ${r.id}</b> · ${r.status||""}<br>${r.boat||""} ${r.notes||""}</div>`).join("");
  list.querySelectorAll("[data-jump]").forEach(n=>n.onclick=()=>{
    const hit=NUMS.find(x=>String(x.n)===n.dataset.jump);
    if(!hit) return;
    filter=hit.dock;
    [...chipsEl.children].forEach(x=>x.classList.toggle("on", x.textContent===filter));
    select(hit.n, docks.find(d=>d.id===hit.dock));
  });
}
renderPad(); renderDir();

let scale=1,tx=0,ty=0;
const img=document.getElementById("map");
const apply=()=>{img.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;};
const chart=document.getElementById("chart");
chart.addEventListener("wheel",e=>{e.preventDefault();scale=Math.min(4,Math.max(.4,scale*(e.deltaY<0?1.08:0.92)));apply();},{passive:false});
let drag=null;
chart.addEventListener("pointerdown",e=>{drag={x:e.clientX-tx,y:e.clientY-ty};chart.setPointerCapture(e.pointerId);});
chart.addEventListener("pointermove",e=>{if(!drag)return;tx=e.clientX-drag.x;ty=e.clientY-drag.y;apply();});
chart.addEventListener("pointerup",()=>drag=null);
const fit=()=>{scale=1;tx=0;ty=0;apply();};
document.getElementById("z-in").onclick=()=>{scale=Math.min(4,scale*1.15);apply();};
document.getElementById("z-out").onclick=()=>{scale=Math.max(.4,scale/1.15);apply();};
document.getElementById("z-full").onclick=fit;
</script>
</body>
</html>
