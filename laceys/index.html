<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Lacey's Narrows · slip chart</title>
<meta name="theme-color" content="#0c3c41"/>
<style>
:root{--water:#0c3c41;--ink:#eef4f3;--muted:#b7c9c7;--chip:#13494e;--walk:#bfb9ac}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--water);color:var(--ink);font-family:-apple-system,system-ui,Segoe UI,sans-serif}
header{padding:calc(10px + env(safe-area-inset-top)) 16px 4px}
.kicker{font-size:11px;letter-spacing:.16em;color:var(--muted)}
.top{display:flex;align-items:flex-end;gap:16px}
h1{margin:4px 0 0;font-size:28px;font-weight:650}
.meta{margin-left:auto;text-align:right;font-size:13px;color:var(--muted)}
.search{padding:8px 16px 0}
.search input{width:100%;border:0;border-radius:12px;padding:12px 14px;font-size:15px;background:#15565b;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px}
.chip{flex:0 0 auto;border:0;border-radius:999px;padding:8px 13px;background:var(--chip);color:var(--ink);cursor:pointer;font-size:14px}
.chip.on{background:#d5ecea;color:#0c3c41;font-weight:700}
.layout{display:grid;grid-template-columns:1fr 300px;height:calc(100% - 168px)}
.chart{position:relative;overflow:hidden;cursor:grab;margin-left:10px;border-radius:14px 0 0 0;background:#0a3539}
.chart:active{cursor:grabbing}
svg{transform-origin:0 0}
.slip{cursor:pointer}
.slip rect{stroke:#3a4342;stroke-width:.5}
.slip.on rect{stroke:#fff;stroke-width:2}
.slip.dim{opacity:.2}
.slip text{pointer-events:none;font-weight:700;font-size:10px;fill:#1b2423}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border:0;border-radius:10px;background:#fff;color:#173;font-size:18px;cursor:pointer}
aside{background:#0a3338;padding:16px;overflow:auto}
.tabs{display:flex;gap:16px;margin-bottom:12px}
.tabs button{background:none;border:0;color:var(--muted);font-size:15px;padding-bottom:6px;cursor:pointer}
.tabs button.on{color:var(--ink);box-shadow:inset 0 -2px 0 #d5ecea}
aside h2{font-size:16px;margin:0 0 6px}
aside p{font-size:13px;color:var(--muted);line-height:1.45}
aside label{display:block;font-size:12px;color:var(--muted);margin-top:8px}
aside input,aside textarea{width:100%;border:0;border-radius:10px;padding:9px;margin-top:4px;background:#15565b;color:var(--ink);font:inherit}
.st{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.st button{border:0;border-radius:999px;padding:7px 10px;background:#15565b;color:var(--ink);cursor:pointer;font-size:12px}
.st button.on{background:#d5ecea;color:#0c3c41;font-weight:700}
.dir-item{padding:8px 0;border-bottom:1px solid #165156;font-size:13px;cursor:pointer}
@media(max-width:860px){.layout{grid-template-columns:1fr;height:auto}.chart{height:55vh;margin:0 12px;border-radius:14px}}
@media print{header,.search,.chips,.zoom{display:none!important}aside{display:none}}
</style>
</head>
<body>
<header>
  <div class="kicker">GREERS FERRY LAKE · HIGDEN, AR</div>
  <div class="top">
    <h1>Lacey's Narrows</h1>
    <div class="meta">
      <div id="count"></div>
      <div>Click a numbered slip · drag to pan</div>
    </div>
  </div>
</header>
<div class="search"><input id="q" type="search" placeholder="Search slip number, e.g. 273"/></div>
<div class="chips" id="chips"></div>
<div class="layout">
  <div class="chart" id="chart">
    <svg id="svg" viewBox="0 0 2100 1500" width="2100" height="1500"></svg>
    <div class="zoom">
      <button id="z-in">+</button>
      <button id="z-out">−</button>
      <button id="z-full">⛶</button>
    </div>
  </div>
  <aside>
    <div class="tabs">
      <button class="on" data-tab="slip">Slip</button>
      <button data-tab="dir">Directory</button>
    </div>
    <div id="pane-slip">
      <h2>Find a slip</h2>
      <p>Click any numbered slip on the chart. Occupancy, boat name, and notes stay on this device.</p>
      <div id="slip-detail" hidden>
        <h2 id="slip-title"></h2>
        <p id="slip-meta"></p>
        <div class="st">
          <button data-st="vacant">Vacant</button>
          <button data-st="occupied">Occupied</button>
          <button data-st="reserved">Reserved</button>
        </div>
        <label>Boat name<input id="boat"/></label>
        <label>Notes<textarea id="notes" rows="3"></textarea></label>
      </div>
    </div>
    <div id="pane-dir" hidden>
      <h2>Directory</h2>
      <div id="dir-list"></div>
    </div>
  </aside>
</div>
<script>
const STORE="laceys-slips-v5";
const load=()=>{try{return JSON.parse(localStorage.getItem(STORE)||"{}")}catch{return{}}};
const save=d=>localStorage.setItem(STORE,JSON.stringify(d));
let data=load();
const svg=document.getElementById("svg");
const NS="http://www.w3.org/2000/svg";
const el=(n,a,t)=>{const e=document.createElementNS(NS,n);Object.entries(a||{}).forEach(([k,v])=>e.setAttribute(k,v));if(t!=null)e.textContent=t;return e;};
const seq=(a,b)=>{const o=[];if(a<=b)for(let i=a;i<=b;i++)o.push(i);else for(let i=a;i>=b;i--)o.push(i);return o;};
const COLORS={pref:"#d2b48c",std:"#c9896a",wide:"#5aa0c4",sales:"#e39a7a",cruiser:"#e8c4b4",hb:"#6dad6a",hb2:"#4f9ea3",fuel:"#e3c35c",courtesy:"#f3efe6"};
const slips=[];
function add(num,dock,kind,size,x,y,w,h,filter){
  slips.push({id:String(num),num,dock,kind,size,x,y,w,h,filter:filter||dock});
}

svg.appendChild(el("rect",{width:2100,height:1500,fill:"#0c3c41"}));
svg.appendChild(el("text",{x:1050,y:28,"text-anchor":"middle",fill:"#c5d8d6","font-size":15,"letter-spacing":3},"NARROWS CHANNEL"));
svg.appendChild(el("text",{x:1050,y:1484,"text-anchor":"middle",fill:"#c5d8d6","font-size":15,"letter-spacing":3},"NARROWS CHANNEL"));

svg.appendChild(el("rect",{x:1480,y:48,width:280,height:90,rx:8,fill:"#8a8f62"}));
svg.appendChild(el("text",{x:1620,y:82,"text-anchor":"middle",fill:"#243018","font-size":14,"font-weight":700},"SHOP / Service Dept."));
svg.appendChild(el("text",{x:1620,y:102,"text-anchor":"middle",fill:"#243018","font-size":12},"Office"));
svg.appendChild(el("ellipse",{cx:1620,cy:175,rx:90,ry:32,fill:"none",stroke:"#9ad","stroke-width":3}));
svg.appendChild(el("text",{x:1620,y:182,"text-anchor":"middle",fill:"#8ec4ea","font-size":20,"font-weight":800},"P"));
svg.appendChild(el("text",{x:1620,y:228,"text-anchor":"middle",fill:"#c5d8d6","font-size":11},"Main walkway · Dock 10 access"));
svg.appendChild(el("rect",{x:1880,y:48,width:80,height:1400,fill:"#8a8a84"}));
svg.appendChild(el("text",{x:1920,y:720,fill:"#222",transform:"rotate(90 1920 720)","font-size":14},"Hwy 92 Bridge"));

function lab(x,y,t,s){svg.appendChild(el("text",{x,y,fill:"#d7eceb","font-size":s||13,"font-weight":700},t));}
function walk(x,y,w,h){svg.appendChild(el("rect",{x,y,width:w,height:h,rx:3,fill:"#bfb9ac"}));}

const SW=26, SH=16, GAP=3;

function pairRow(dock, top, bot, x0,y, kind, size){
  walk(x0-8, y-4, top.length*(SW+GAP)+16, SH*2+14);
  lab(x0-22, y+SH+6, dock, 15);
  top.forEach((n,i)=>add(n,dock,kind,size, x0+i*(SW+GAP), y, SW,SH, dock));
  bot.forEach((n,i)=>add(n,dock,kind,size, x0+i*(SW+GAP), y+SH+6, SW,SH, dock));
}

/* Docks 5 then 4–1 stacked, LEFT of marina store */
const prefX=50;
lab(prefX, 228, "10×30 Preferred", 13);
pairRow("5", seq(282,273), seq(283,292), prefX, 248, "pref", "10×30 Preferred");
pairRow("4", seq(19,32), seq(14,1), prefX, 318, "pref", "10×30 Preferred");
pairRow("3", seq(49,64), seq(48,33), prefX, 388, "pref", "10×30 Preferred");
pairRow("2", seq(261,272), seq(260,249), prefX, 458, "wide", "16×42");
pairRow("1", seq(237,248), seq(236,225), prefX, 528, "wide", "16×42");
svg.appendChild(el("rect",{x:prefX+400,y:502,width:58,height:22,rx:4,fill:"#2b6d8a"}));
svg.appendChild(el("text",{x:prefX+429,y:517,"text-anchor":"middle",fill:"#fff","font-size":10},"Restroom"));

/* Cluster west → east: cruiser E–W, houseboats N–S, sales/fuel N–S, store N–S */
const clY=620;

/* Cruiser — E–W walkway, N–S slips (west, where houseboats were) */
const cruX=50, cruY=clY+20;
lab(cruX, cruY-12, "Cruiser dock", 12);
const cruTop=[800,808,809,810,811,812,813,814,815,816];
const cruBot=[801,802,803,804,805,806,807];
const cW=18, cH=38, cG=4;
walk(cruX-6, cruY+cH+2, cruTop.length*(cW+cG)+12, 12);
cruTop.forEach((n,i)=>add(n,"Cruiser","cruiser","Cruiser", cruX+i*(cW+cG), cruY, cW,cH, "Cruiser"));
cruBot.forEach((n,i)=>add(n,"Cruiser","cruiser","Cruiser", cruX+i*(cW+cG), cruY+cH+16, cW,cH, "Cruiser"));
svg.appendChild(el("rect",{x:cruX,y:cruY+cH*2+22,width:62,height:28,rx:4,fill:"#e7a0b8"}));
svg.appendChild(el("text",{x:cruX+31,y:cruY+cH*2+40,"text-anchor":"middle",fill:"#4a2430","font-size":10},"Picnic"));

/* Houseboats — N–S walkway, two rows of E–W slips */
const hbX=cruX+cruTop.length*(cW+cG)+28;
lab(hbX, clY-10, "Houseboat dock", 12);
const hbW=42, hbH=16;
walk(hbX+hbW+2, clY, 14, 14*18+70);
seq(817,830).forEach((n,i)=>add(n,"Houseboats", i<10?"hb":"hb2", i<10?"12×38":"12×30", hbX, clY+i*18, hbW,hbH, "Houseboats"));
seq(831,838).forEach((n,i)=>add(n,"Houseboats","hb","12×38", hbX+hbW+18, clY+i*18, hbW,hbH, "Houseboats"));
add(839,"Fuel","fuel","20×87", hbX, clY+14*18+8, hbW*2+18, 22, "Fuel");
add(840,"Fuel","fuel","20×87", hbX, clY+14*18+34, hbW*2+18, 22, "Fuel");
svg.appendChild(el("text",{x:hbX,y:clY+14*18+74,fill:"#c5d8d6","font-size":11},"Emma's Room · 24×100"));

/* Sales — VERTICAL, one row of slips, walkway, fuel/courtesy on the other side */
const salesX=520;
lab(salesX, clY-10, "Sales 10×34", 12);
const sales=seq(856,841);
const sy=clY;
sales.forEach((n,i)=>add(n,"Sales","sales","10×34", salesX, sy+i*18, 36,16, "Sales"));
add("WB","Work boat","hb2","Work boat", salesX, sy+sales.length*18, 36,18, "Work boat");
const walkX=salesX+40, walkH=sales.length*18+24;
walk(walkX, sy-2, 16, walkH);
lab(walkX+22, sy-10, "Fuel · courtesy", 11);
seq(1,4).forEach((i)=>add("F"+i,"Fuel","fuel","Fuel stall", walkX+22, sy+(i-1)*20, 40,18, "Fuel"));
seq(1,6).forEach((i)=>add("C"+i,"Courtesy","courtesy","Courtesy", walkX+22, sy+4*20+8+(i-1)*20, 40,18, "All"));

/* Marina store dock — VERTICAL (N–S), east of sales */
const storeX=walkX+80, storeY=240;
svg.appendChild(el("rect",{x:storeX,y:storeY,width:90,height:48,rx:6,fill:"#2b6d8a"}));
svg.appendChild(el("text",{x:storeX+45,y:storeY+20,"text-anchor":"middle",fill:"#fff","font-size":12,"font-weight":700},"Marina Store"));
svg.appendChild(el("text",{x:storeX+45,y:storeY+36,"text-anchor":"middle",fill:"#d7eceb","font-size":10},"Wave runners"));
walk(storeX+36, storeY+52, 18, 520);
svg.appendChild(el("rect",{x:storeX,y:storeY+52,width:90,height:520,rx:6,fill:"#2a6a70",opacity:.35}));
lab(storeX, storeY+580, "Store dock", 12);

/* Standard 7–13 — along the causeway, RIGHT */
lab(900, 228, "10×30 Standard", 13);
walk(888, 238, 720, 16);
const east=[
  ["7", seq(65,80), seq(96,81)],
  ["8", seq(97,112), seq(128,113)],
  ["9", seq(129,144), seq(160,145)],
  ["10", seq(161,176), seq(192,177)],
  ["11", seq(193,208), seq(224,209)],
  ["12", seq(293,308), seq(324,309)],
  ["13", seq(325,340), seq(356,341)]
];
east.forEach((d,di)=>{
  const x=910+di*100, y=238, n=d[1].length;
  walk(x, y, 14, n*(SH+GAP)+24);
  lab(x+2, y-6, d[0], 14);
  d[1].forEach((num,i)=>add(num,d[0],"std","10×30 Standard", x-SW-2, y+22+i*(SH+GAP), SW,SH, d[0]));
  d[2].forEach((num,i)=>add(num,d[0],"std","10×30 Standard", x+16, y+22+i*(SH+GAP), SW,SH, d[0]));
});

const layer=el("g",{id:"slips"});
svg.appendChild(layer);
let selected=null, filter="All";
function fill(s){
  const rec=data[s.id];
  if(rec&&rec.status==="occupied") return "#b55a32";
  if(rec&&rec.status==="reserved") return "#d7b45a";
  return COLORS[s.kind]||"#e4dcc8";
}
function match(s,f){ if(!f||f==="All") return true; return s.filter===f || s.dock===f; }
function redraw(){
  layer.innerHTML="";
  slips.forEach(s=>{
    const g=el("g",{class:"slip"+(selected===s.id?" on":"")+(match(s,filter)?"":" dim"), "data-id":s.id});
    g.appendChild(el("rect",{x:s.x,y:s.y,width:s.w,height:s.h,rx:2,fill:fill(s)}));
    const label=String(s.num).replace(/^F|^C/,"");
    g.appendChild(el("text",{x:s.x+s.w/2,y:s.y+s.h/2+4,"text-anchor":"middle"}, label));
    layer.appendChild(g);
  });
}
document.getElementById("count").textContent = slips.filter(s=>/^\d+$/.test(String(s.num))).length+" numbered slips";
const chips=["All","5","4","3","2","1","7","8","9","10","11","12","13","Houseboats","Cruiser","Work boat","Fuel","Sales"];
const chipsEl=document.getElementById("chips");
chips.forEach(c=>{
  const b=document.createElement("button");
  b.className="chip"+(c==="All"?" on":"");
  b.textContent=c;
  b.onclick=()=>{filter=c;[...chipsEl.children].forEach(x=>x.classList.toggle("on",x.textContent===c));redraw();};
  chipsEl.appendChild(b);
});
redraw();
svg.addEventListener("click",e=>{
  const t=e.target.closest("[data-id]"); if(!t) return;
  select(t.getAttribute("data-id"));
});
function select(id){
  selected=id;
  const s=slips.find(x=>x.id===id);
  const rec=data[id]||{status:"vacant",boat:"",notes:""};
  document.getElementById("slip-detail").hidden=false;
  document.getElementById("slip-title").textContent = (/^\d+$/.test(String(s.num))?"Slip ":"")+s.num;
  document.getElementById("slip-meta").textContent = "Dock "+s.dock+" · "+s.size;
  document.getElementById("boat").value=rec.boat||"";
  document.getElementById("notes").value=rec.notes||"";
  document.querySelectorAll(".st button").forEach(b=>b.classList.toggle("on", b.dataset.st===(rec.status||"vacant")));
  showTab("slip"); redraw();
}
document.querySelectorAll(".st button").forEach(b=>b.onclick=()=>{
  if(!selected) return;
  data[selected]=data[selected]||{};
  data[selected].status=b.dataset.st; save(data); select(selected);
});
["boat","notes"].forEach(fid=>{
  document.getElementById(fid).addEventListener("input",()=>{
    if(!selected) return;
    data[selected]=data[selected]||{status:"vacant"};
    data[selected][fid]=document.getElementById(fid).value; save(data); renderDir();
  });
});
document.getElementById("q").addEventListener("input", function(){
  const v=this.value.trim();
  const hit=slips.find(s=>String(s.num)===v);
  if(hit) select(hit.id);
});
function showTab(name){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===name));
  document.getElementById("pane-slip").hidden=name!=="slip";
  document.getElementById("pane-dir").hidden=name!=="dir";
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function renderDir(){
  const list=document.getElementById("dir-list");
  const rows=Object.keys(data).map(id=>({id,...data[id]})).filter(r=>r.boat||r.notes||(r.status&&r.status!=="vacant"));
  if(!rows.length){list.innerHTML="<p>No marked slips yet.</p>";return;}
  list.innerHTML=rows.map(r=>`<div class="dir-item" data-jump="${r.id}"><b>${/^\d+$/.test(r.id)?"Slip "+r.id:r.id}</b> · ${r.status||""}<br>${r.boat||""} ${r.notes||""}</div>`).join("");
  list.querySelectorAll("[data-jump]").forEach(n=>n.onclick=()=>select(n.dataset.jump));
}
renderDir();
let scale=1,tx=0,ty=0;
const apply=()=>svg.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
const chart=document.getElementById("chart");
chart.addEventListener("wheel",e=>{e.preventDefault();scale=Math.min(3.5,Math.max(.4,scale*(e.deltaY<0?1.08:0.92)));apply();},{passive:false});
let drag=null;
chart.addEventListener("pointerdown",e=>{if(e.target.closest("[data-id]"))return;drag={x:e.clientX-tx,y:e.clientY-ty};chart.setPointerCapture(e.pointerId);});
chart.addEventListener("pointermove",e=>{if(!drag)return;tx=e.clientX-drag.x;ty=e.clientY-drag.y;apply();});
chart.addEventListener("pointerup",()=>drag=null);
const fit=()=>{scale=1;tx=0;ty=0;apply();};
document.getElementById("z-in").onclick=()=>{scale=Math.min(3.5,scale*1.15);apply();};
document.getElementById("z-out").onclick=()=>{scale=Math.max(.4,scale/1.15);apply();};
document.getElementById("z-full").onclick=fit;
</script>
</body>
</html>
