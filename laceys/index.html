<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Lacey's Narrows</title>
<meta name="theme-color" content="#0c3c41"/>
<style>
  html,body{margin:0;height:100%;background:#0c3c41;color:#eef4f3;font-family:-apple-system,system-ui,sans-serif}
  #boot{padding:24px}
  a{color:#d5ecea}
</style>
</head>
<body>
<div id="boot">Loading Lacey's map…</div>
<script>
(function(){
  var urls = [
    "https://raw.githubusercontent.com/tiffany148/Greers-Ferry-Lake-Map-II-/8c295d043b8b8dbe94b7c3c466d81ef212ce9428/laceys/index.html",
    "https://cdn.jsdelivr.net/gh/tiffany148/Greers-Ferry-Lake-Map-II-@8c295d043b8b8dbe94b7c3c466d81ef212ce9428/laceys/index.html"
  ];
  function go(i){
    if(i>=urls.length){
      document.getElementById("boot").innerHTML = 'Could not restore automatically. Open the working copy: <a href="../laceys-sandbox/">Sandbox</a>';
      return;
    }
    fetch(urls[i], {cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("bad status");
      return r.text();
    }).then(function(html){
      if(!html || html.indexOf("<svg")===-1 || html.indexOf("PLACEHOLDER")!==-1) throw new Error("bad html");
      document.open();
      document.write(html);
      document.close();
    }).catch(function(){ go(i+1); });
  }
  go(0);
})();
</script>
</body>
</html>
