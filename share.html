<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a2438" />
<title>Greers Ferry Lake Explorer</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { --bg:#071822; --ink:#e8f2f7; --accent:#c49a58; --panel:#0e2a3a; --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px); }
  * { box-sizing:border-box; }
  html,body,#map { height:100%; margin:0; }
  body { font-family:-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { position:absolute; top:0; left:0; right:0; z-index:800; display:flex; gap:8px; align-items:center; padding:calc(8px + var(--safe-top)) 10px 8px; background:linear-gradient(180deg,#071822ee,#07182200); }
  h1 { font-size:15px; margin:0; white-space:nowrap; }
  header button, header input { border:0; border-radius:12px; padding:10px 12px; font-size:14px; background:#123447; color:var(--ink); }
  #search-wrap { position:relative; flex:1; min-width:0; }
  header input { width:100%; }
  #hits { display:none; position:absolute; left:0; right:0; top:100%; margin:4px 0 0; max-height:40vh; overflow:auto; background:var(--panel); border-radius:12px; list-style:none; padding:6px; box-shadow:0 8px 24px #0008; }
  #hits button { display:block; width:100%; text-align:left; background:transparent; border:0; color:var(--ink); padding:8px 10px; border-radius:8px; font-size:14px; }
  #hits button:hover, #hits button:focus { background:#123447; }
  .hits-meta { font-size:11px; color:#9bb4c4; margin-left:6px; }
  .sheet { display:none; position:absolute; z-index:900; right:10px; top:calc(56px + var(--safe-top)); width:min(280px, calc(100% - 20px)); background:var(--panel); border-radius:16px; padding:14px; box-shadow:0 12px 32px #0009; }
  .sheet.open { display:block; }
  .sheet h2 { font-size:13px; margin:0 0 10px; letter-spacing:.04em; text-transform:uppercase; color:#9bb4c4; }
  .row { display:flex; align-items:center; gap:8px; margin:8px 0; font-size:14px; }
  .row.slider { flex-wrap:wrap; }
  .row.slider input[type=range] { flex:1; min-width:120px; accent-color:var(--accent); }
  .row.slider .hits-meta { margin-left:auto; }
  .row input { accent-color:var(--accent); }
  .swatch { width:10px; height:10px; border-radius:50%; border:1px solid #fff8; }
  .fabs { position:absolute; right:10px; bottom:calc(18px + var(--safe-bot)); z-index:800; display:flex; flex-direction:column; gap:8px; }
  .fab { width:48px; height:48px; border-radius:50%; border:0; background:#c49a58; color:#071822; font-weight:700; }
  #btn-north { transition: transform .2s ease; }
  .ghost { background:#123447; color:var(--ink); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background:#0e2a3a; color:#e8f2f7; }
  .note { position:absolute; left:10px; bottom:calc(14px + var(--safe-bot)); z-index:700; font-size:10px; color:#9bb4c4; max-width:52%; }
  .pin-form { display:none; position:absolute; z-index:950; left:50%; top:40%; transform:translate(-50%,-50%); width:min(300px,90vw); background:var(--panel); border-radius:16px; padding:16px; }
  .pin-form.open { display:block; }
  .pin-form input, .pin-form select, .pin-form textarea { width:100%; margin:8px 0 10px; border:0; border-radius:10px; padding:10px; background:#123447; color:var(--ink); font:inherit; }
  .pin-form textarea { min-height:64px; resize:vertical; }
  .pin-form .actions { display:flex; gap:8px; justify-content:flex-end; align-items:center; }
  .pin-form .actions .grow { margin-right:auto; }
  .pin-form button { border:0; border-radius:12px; padding:8px 14px; font-size:14px; background:#123447; color:var(--ink); }
  .pin-form .danger { background:#5c2430; color:#ffd7de; }
  .popup-actions { margin-top:10px; display:flex; gap:8px; }
  .popup-actions button { border:0; border-radius:10px; padding:6px 10px; background:#123447; color:#e8f2f7; font-size:13px; }
  .place-hint { display:none; position:absolute; z-index:850; left:50%; top:calc(58px + var(--safe-top)); transform:translateX(-50%); background:#c49a58; color:#071822; font-weight:700; font-size:13px; padding:8px 14px; border-radius:999px; white-space:nowrap; }
  .place-hint.on { display:block; }
  .fab.placing { box-shadow:0 0 0 3px #fff8; }
  .sheet .unlock-row { margin-top:10px; }
  .sheet .unlock-row button { width:100%; border:0; border-radius:12px; padding:10px 12px; background:#123447; color:var(--ink); font-size:14px; }
  .sheet .unlock-row button.on { background:#2a5a3a; }
  .pw-form { display:none; position:absolute; z-index:960; left:50%; top:40%; transform:translate(-50%,-50%); width:min(300px,90vw); background:var(--panel); border-radius:16px; padding:16px; }
  .pw-form.open { display:block; }
  .pw-form input { width:100%; margin:8px 0 12px; border:0; border-radius:10px; padding:10px; background:#123447; color:var(--ink); }
  .pw-form .actions { display:flex; gap:8px; justify-content:flex-end; }
  .pw-form button { border:0; border-radius:12px; padding:8px 14px; font-size:14px; background:#123447; color:var(--ink); }
  .pw-err { color:#ffd7de; font-size:12px; min-height:1em; }
  .extra-fields { margin:0 0 8px; }
  .marina-block { margin-top:8px; font-size:13px; line-height:1.35; }
  .marina-block a { color:#7bdff2; }
  .marina-svc { margin-top:4px; color:#c9dce8; }
  .crowd-meta { font-size:11px; color:#9bb4c4; margin-top:4px; }
  .public-view #pw-form, .public-view .unlock-row { display:none !important; }

  .opacity-box {
    position:absolute; right:10px; bottom:calc(78px + var(--safe-bot)); z-index:800;
    background:#fff; color:#123; border-radius:10px; padding:8px 12px;
    display:flex; align-items:center; gap:10px; box-shadow:0 4px 16px #0005;
    font-size:13px; font-weight:600;
  }
  .opacity-box.hidden { display:none; }
  .opacity-box input[type=range] { width:120px; accent-color:#3b82f6; }

</style>
</head>
<body>
<header>
  <h1>Greers Ferry Lake</h1>
  <div id="search-wrap">
    <input id="q" type="search" placeholder="Search dam, marina, cove…" autocomplete="off" />
    <ul id="hits"></ul>
  </div>
  <button id="btn-layers" type="button">Layers</button>
  <button id="btn-locate" type="button">Me</button>
</header>
<div id="map"></div>
<div id="sheet" class="sheet" role="dialog" aria-label="Map layers">
  <h2>Base map</h2>
  <label class="row"><input type="radio" name="base" value="auto" checked /> Auto (topo to satellite to streets)</label>
  <label class="row"><input type="radio" name="base" value="satellite" /> Satellite</label>
  <label class="row"><input type="radio" name="base" value="streets" /> Streets</label>
  <label class="row"><input type="radio" name="base" value="topo" /> Topo</label>
  <label class="row slider" id="blend-row">Auto switch <input id="blend-speed" type="range" min="1" max="10" value="7" /> <span class="hits-meta" id="blend-label">faster</span></label>
  <h2>Historical overlay</h2>
  <label class="row"><input type="checkbox" id="hist-on" /> USGS historic topo (scanned)</label>
  <label class="row"><input type="checkbox" id="prelake-on" /> Pre-lake valley (1894)</label>
  <h2>Pins</h2>
  <div id="cats"></div>
  <div class="unlock-row">
    <button type="button" id="btn-unlock-shared">Unlock shared edits</button>
  </div>
</div>
<div id="pw-form" class="pw-form">
  <strong>Shared pin password</strong>
  <input id="pw-input" type="password" placeholder="Password" autocomplete="current-password" />
  <div id="pw-err" class="pw-err"></div>
  <div class="actions">
    <button type="button" id="pw-cancel">Cancel</button>
    <button type="button" id="pw-ok" class="fab" style="width:auto;height:auto;border-radius:12px;padding:8px 14px;">Unlock</button>
  </div>
</div>
<div id="place-hint" class="place-hint">Tap the map to drop a pin</div>
<div id="pin-form" class="pin-form">
  <strong id="pin-form-title">Drop a pin</strong>
  <input id="pin-name" type="text" placeholder="Name this spot" />
  <select id="pin-cat">
    <option>Shared</option>
    <option>My pins</option>
    <option>Hazards</option>
    <option>Water</option>
    <option>Cove</option>
    <option>Marina</option>
    <option>Park</option>
    <option>Landmark</option>
    <option>Town</option>
    <option>Infrastructure</option>
  </select>
  <div id="extra-hazard" class="extra-fields" hidden>
    <select id="hazard-type">
      <option>Trees / logs</option>
      <option>Shallow area</option>
      <option>Rocks</option>
      <option>Debris</option>
      <option>Other hazard</option>
    </select>
  </div>
  <div id="extra-water" class="extra-fields" hidden>
    <input id="water-depth" type="number" inputmode="decimal" step="0.1" min="0" placeholder="Depth (ft)" />
    <input id="water-temp" type="number" inputmode="decimal" step="0.1" placeholder="Water temp (°F)" />
  </div>
  <textarea id="pin-fact" placeholder="Note (optional)"></textarea>
  <div class="actions">
    <button type="button" id="pin-delete" class="danger grow" hidden>Delete</button>
    <button type="button" id="pin-move" hidden>Move</button>
    <button type="button" id="pin-cancel">Cancel</button>
    <button type="button" id="pin-save" class="fab" style="width:auto;height:auto;border-radius:12px;padding:8px 14px;">Save</button>
  </div>
</div>
<div id="opacity-box" class="opacity-box hidden">
  <span>Opacity</span>
  <input id="hist-opacity" type="range" min="0" max="100" value="65" />
</div>
<div class="fabs">
  <button class="fab ghost" id="btn-north" type="button" title="Reset north">N</button>
  <button class="fab" id="btn-pin" type="button" title="Add pin">+</button>
</div>
<p class="note">Not a navigation chart. USACE / public map data.</p>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="coves.js"></script>
<script>
const PUBLIC_VIEW = true;
const PINS = [
  {name:"Greers Ferry Dam",lat:35.5208,lng:-91.9956,cat:"Infrastructure",fact:"USACE flood control and hydropower. JFK dedicated the dam Oct 3, 1963."},
  {name:"Visitor Center",lat:35.5219,lng:-91.9994,cat:"Park",fact:"Dam overlook and project exhibits."},
  {name:"Heber Springs",lat:35.4915,lng:-92.0313,cat:"Town",fact:"Cleburne County seat."},
  {name:"Greers Ferry",lat:35.5770,lng:-92.1630,cat:"Town",fact:"North shore above The Narrows."},
  {name:"Higden",lat:35.5666,lng:-92.2048,cat:"Town",fact:"Town relocated when the lake filled."},
  {name:"Fairfield Bay",lat:35.6050,lng:-92.2700,cat:"Town",fact:"West-arm resort community."},
  {name:"Edgemont",lat:35.6023,lng:-92.1963,cat:"Town",fact:"North of The Narrows."},
  {name:"The Narrows",lat:35.5511,lng:-92.1870,cat:"Landmark",fact:"Channel between the two basins."},
  {name:"Lacey's Narrows Marina",lat:35.5596,lng:-92.1942,cat:"Marina",fact:"Full-service marina on The Narrows."},
  {name:"Shiloh Marina",lat:35.5392,lng:-92.1462,cat:"Marina",fact:"South-central arm."},
  {name:"Hill Creek Marina",lat:35.6078,lng:-92.1491,cat:"Marina",fact:"Devil's Fork arm."},
  {name:"Eden Isle Marina",lat:35.5013,lng:-92.0954,cat:"Marina",fact:"Near Heber Springs."},
  {name:"Sugar Loaf Mountain",lat:35.5612,lng:-92.2638,cat:"Landmark",fact:"Island summit, west basin."},
  {name:"Narrows Launch",lat:35.5633,lng:-92.1963,cat:"Park",fact:"Public ramp on The Narrows."},
  {name:"Old Highway 25 Park",lat:35.5342,lng:-92.0155,cat:"Park",fact:"Beach and ramp on the lower lake."},
  {name:"Party Cove",lat:35.5605,lng:-92.3322,cat:"Cove",fact:"West-arm gathering cove."},
  {name:"Hurricane Bay",lat:35.5499,lng:-92.1773,cat:"Cove",fact:"East of The Narrows."},
  {name:"Higden Bay",lat:35.5718,lng:-92.2138,cat:"Cove",fact:"Flooded Higden bottoms."},
  {name:"Devil's Fork Launch",lat:35.5919,lng:-92.1801,cat:"Park",fact:"North-arm public ramp."}
];
const extra = (typeof COVE_PINS !== "undefined") ? COVE_PINS : [];
const ALL = PINS.concat(extra.map(function(p){
  return {name:p.name,lat:p.lat,lng:p.lng,cat:p.category||"Cove",fact:p.fact||"",tip:p.tip||""};
}));
const COLORS = {Infrastructure:"#e8c98a",Park:"#4ecdc4",Marina:"#7bdff2",Landmark:"#c49a58",Town:"#f2d0a4",Cove:"#8ecae6","My pins":"#e07a5f",Shared:"#f4a261",Hazards:"#e63946",Water:"#457b9d"};
const MARINA_INFO = {
  "Lacey's Narrows Marina": {
    address: "7674 Edgemont Road, Greers Ferry, AR 72067",
    phone: "501-825-6214",
    website: "https://www.laceysmarina.com/",
    hours: "Ship store Mon–Fri 8am–5pm (call ahead weekends)",
    services: ["Full-service marina","Boat sales & service","Covered slips","Fuel (24-hr pumps)","Pontoon / houseboat / WaveRunner rentals","Ship's store"]
  },
  "Shiloh Marina": {
    address: "1350 Shiloh Road, Greers Ferry / Higden, AR 72067",
    phone: "501-825-6237",
    website: "https://www.shiloh-marina.com/",
    hours: "Call for current hours",
    services: ["Boat slips","Boat service","Pontoon rentals","Ramp / park access","Ship's store"]
  },
  "Hill Creek Marina": {
    address: "500 Hill Creek Road, Edgemont, AR 72044",
    phone: "870-948-2230",
    website: "",
    hours: "Call for current hours",
    services: ["Boat slips","Launch ramp","Marina store"]
  },
  "Eden Isle Marina": {
    address: "10 Yacht Harbor Road, Heber Springs, AR 72543",
    phone: "501-362-2232",
    website: "https://www.edenislemarina.com/",
    hours: "Mon–Fri 9am–4pm (call ahead)",
    services: ["Secure boat slips","Pontoon rentals","Boat sales","Ship's store / fuel & ice"]
  }
};
function colorFor(cat){ return COLORS[cat] || "#c49a58"; }
function esc(s){ return String(s||"").replace(/[&<>"']/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }
function stockKey(p){ return p.name+"|"+p.lat+"|"+p.lng; }
const STORE_USER = PUBLIC_VIEW ? "gfl-share-user-pins" : "gfl-user-pins";
const STORE_OVR = "gfl-pin-overrides";
const STORE_UNLOCK = "gfl-shared-unlocked";
const SHARED_PW_HASH = "249aed4359f903fdfd01ed7b14d007c6f7a0c4a80dd75d44e05e054107b7c948";
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDLTQLu94IcfD_FqhoCw_MkVte4EP-F1T8",
  authDomain: "greers-ferry-lake-pins.firebaseapp.com",
  databaseURL: "https://greers-ferry-lake-pins-default-rtdb.firebaseio.com",
  projectId: "greers-ferry-lake-pins",
  storageBucket: "greers-ferry-lake-pins.firebasestorage.app",
  messagingSenderId: "399038895739",
  appId: "1:399038895739:web:9fdccd1604db2d2930b4de"
};
let userPins = JSON.parse(localStorage.getItem(STORE_USER)||"[]");
let overrides = JSON.parse(localStorage.getItem(STORE_OVR)||"{}");
let sharedPins = [];
let hazardPins = [];
let waterPins = [];
let sharedUnlocked = localStorage.getItem(STORE_UNLOCK) === "1";
let sharedReady = false;
let db = null;
userPins = userPins.map(function(p,i){
  if (!p.id) p.id = "u-"+Date.now()+"-"+i;
  if (!p.cat) p.cat = "My pins";
  return p;
});
function persistPins(){
  localStorage.setItem(STORE_USER, JSON.stringify(userPins));
  localStorage.setItem(STORE_OVR, JSON.stringify(overrides));
}
function visiblePins(){
  const stock = ALL.map(function(p){
    const key = stockKey(p);
    const o = overrides[key];
    if (o && o.deleted) return null;
    const out = Object.assign({kind:"stock", key:key}, p);
    if (o) { if (o.name!=null) out.name=o.name; if (o.lat!=null) out.lat=o.lat; if (o.lng!=null) out.lng=o.lng; if (o.cat) out.cat=o.cat; if (o.fact!=null) out.fact=o.fact; if (o.tip!=null) out.tip=o.tip; }
    return out;
  }).filter(Boolean);
  const mine = userPins.map(function(p){ return Object.assign({kind:"user"}, p); });
  const shared = sharedPins.map(function(p){ return Object.assign({kind:"shared", cat:"Shared"}, p); });
  const hazards = hazardPins.map(function(p){ return Object.assign({kind:"hazard", cat:"Hazards"}, p); });
  const water = waterPins.map(function(p){ return Object.assign({kind:"water", cat:"Water"}, p); });
  return stock.concat(shared).concat(hazards).concat(water).concat(mine);
}
function sha256Hex(text){
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function(buf){
    return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
  });
}
function syncUnlockUi(){
  const b = document.getElementById("btn-unlock-shared");
  if (!b) return;
  b.textContent = sharedUnlocked ? "Shared edits unlocked" : "Unlock shared edits";
  b.classList.toggle("on", sharedUnlocked);
}
function requireSharedUnlock(){
  if (sharedUnlocked) return Promise.resolve(true);
  return new Promise(function(resolve){
    const form = document.getElementById("pw-form");
    const input = document.getElementById("pw-input");
    const err = document.getElementById("pw-err");
    err.textContent = "";
    input.value = "";
    form.classList.add("open");
    input.focus();
    function cleanup(){
      document.getElementById("pw-ok").onclick = null;
      document.getElementById("pw-cancel").onclick = null;
    }
    document.getElementById("pw-cancel").onclick = function(){
      form.classList.remove("open");
      cleanup();
      resolve(false);
    };
    document.getElementById("pw-ok").onclick = function(){
      sha256Hex(input.value.trim()).then(function(h){
        if (h !== SHARED_PW_HASH) { err.textContent = "Wrong password"; return; }
        sharedUnlocked = true;
        localStorage.setItem(STORE_UNLOCK, "1");
        syncUnlockUi();
        form.classList.remove("open");
        cleanup();
        resolve(true);
      });
    };
  });
}
function initSharedDb(){
  if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.indexOf("REPLACE_") === 0) {
    console.warn("Shared pins: Firebase not configured yet");
    return;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    db.ref("sharedPins").on("value", function(snap){
      const val = snap.val() || {};
      sharedPins = Object.keys(val).map(function(id){
        const p = val[id] || {};
        return {id:id, name:p.name||"Shared pin", lat:+p.lat, lng:+p.lng, fact:p.fact||"", cat:"Shared"};
      }).filter(function(p){ return !isNaN(p.lat) && !isNaN(p.lng); });
      sharedReady = true;
      renderPins();
    });
    db.ref("hazards").on("value", function(snap){
      const val = snap.val() || {};
      hazardPins = Object.keys(val).map(function(id){
        const p = val[id] || {};
        return {id:id, name:p.name||p.hazardType||"Hazard", lat:+p.lat, lng:+p.lng, fact:p.fact||"", hazardType:p.hazardType||"Other hazard", updatedAt:p.updatedAt||0};
      }).filter(function(p){ return !isNaN(p.lat) && !isNaN(p.lng); });
      renderPins();
    });
    db.ref("water").on("value", function(snap){
      const val = snap.val() || {};
      waterPins = Object.keys(val).map(function(id){
        const p = val[id] || {};
        const bits = [];
        if (p.depthFt != null && p.depthFt !== "") bits.push(p.depthFt + " ft");
        if (p.tempF != null && p.tempF !== "") bits.push(p.tempF + " °F");
        return {id:id, name:p.name||(bits.join(" · ")||"Water reading"), lat:+p.lat, lng:+p.lng, fact:p.fact||"", depthFt:p.depthFt, tempF:p.tempF, updatedAt:p.updatedAt||0};
      }).filter(function(p){ return !isNaN(p.lat) && !isNaN(p.lng); });
      renderPins();
    });
  } catch (e) {
    console.warn("Shared pins init failed", e);
  }
}
function saveSharedPin(pin){
  if (!db) return Promise.reject(new Error("Shared sync not ready"));
  const id = pin.id || ("s-"+Date.now());
  const payload = {name:pin.name, lat:pin.lat, lng:pin.lng, fact:pin.fact||"", updatedAt: Date.now()};
  return db.ref("sharedPins/"+id).set(payload).then(function(){ return id; });
}
function deleteSharedPin(id){
  if (!db) return Promise.reject(new Error("Shared sync not ready"));
  return db.ref("sharedPins/"+id).remove();
}
function saveHazardPin(pin){
  if (!db) return Promise.reject(new Error("Sync not ready"));
  const id = pin.id || ("h-"+Date.now());
  const payload = {name:pin.name, hazardType:pin.hazardType||"Other hazard", lat:pin.lat, lng:pin.lng, fact:pin.fact||"", updatedAt: Date.now()};
  return db.ref("hazards/"+id).set(payload).then(function(){ return id; });
}
function deleteHazardPin(id){
  if (!db) return Promise.reject(new Error("Sync not ready"));
  return db.ref("hazards/"+id).remove();
}
function saveWaterPin(pin){
  if (!db) return Promise.reject(new Error("Sync not ready"));
  const id = pin.id || ("w-"+Date.now());
  const payload = {name:pin.name, lat:pin.lat, lng:pin.lng, fact:pin.fact||"", depthFt:pin.depthFt==null||pin.depthFt===""?null:Number(pin.depthFt), tempF:pin.tempF==null||pin.tempF===""?null:Number(pin.tempF), updatedAt: Date.now()};
  return db.ref("water/"+id).set(payload).then(function(){ return id; });
}
function deleteWaterPin(id){
  if (!db) return Promise.reject(new Error("Sync not ready"));
  return db.ref("water/"+id).remove();

function formatWhen(ts){

function clamp01(x){ return Math.max(0, Math.min(1, x)); }
function lerp(a,b,t){ return a + (b-a)*t; }
// Auto stack: topo (wide) → satellite (mid) → streets (close), Google Earth–style.
function blendSettings(){
  var s = 7;
  var el = document.getElementById("blend-speed");
  if (el) s = +el.value || 7;
  var t = (s - 1) / 9; // 0 slow, 1 fast
  var span = 4 - 3 * t; // 4 zoom levels → 1
  var satStart = 12 - 2.2 * t; // later → earlier
  var streetStart = satStart + span + (2.4 - 1.4 * t);
  return {satStart:satStart, satEnd:satStart+span, streetStart:streetStart, streetEnd:streetStart+span};
}
function autoOpacities(z){
  var p = blendSettings();
  var sat = z <= p.satStart ? 0 : z >= p.satEnd ? 1 : clamp01((z - p.satStart) / (p.satEnd - p.satStart));
  var streets = z <= p.streetStart ? 0 : z >= p.streetEnd ? 1 : clamp01((z - p.streetStart) / (p.streetEnd - p.streetStart));
  return {topo:1, sat:sat, streets:streets};
}
function applyAutoBase(){
  var o = autoOpacities(map.getZoom());
  // ensure needed layers exist; remove unused for bandwidth when fully off
  function ensure(layer, on){
    if (on) {
      if (!map.hasLayer(layer)) layer.addTo(map);
    } else if (map.hasLayer(layer)) {
      map.removeLayer(layer);
    }
  }
  ensure(layers.topo, o.topo > 0.02);
  ensure(layers.satellite, o.sat > 0.02);
  ensure(layers.streets, o.streets > 0.02);
  if (map.hasLayer(layers.topo)) {
    layers.topo.setOpacity(1);
    if (layers.topo.bringToBack) layers.topo.bringToBack();
  }
  if (map.hasLayer(layers.satellite)) {
    layers.satellite.setOpacity(o.sat);
  }
  if (map.hasLayer(layers.streets)) {
    layers.streets.setOpacity(o.streets);
    if (layers.streets.bringToFront) layers.streets.bringToFront();
  }
  // keep sat above topo
  if (map.hasLayer(layers.satellite) && layers.satellite.bringToFront) layers.satellite.bringToFront();
  if (map.hasLayer(layers.streets) && layers.streets.bringToFront) layers.streets.bringToFront();
}
function setBaseMode(mode){
  base = mode;
  clearBaseLayers();
  if (mode === "auto") {
    applyAutoBase();
    return;
  }
  layers[mode].setOpacity(1);
  layers[mode].addTo(map);
}

(function(){
  var STORE_BLEND = (typeof PUBLIC_VIEW !== "undefined" && PUBLIC_VIEW) ? "gfl-share-blend" : "gfl-blend-speed";

  var lab = document.getElementById("blend-label");
  var labels = ["slowest","slower","slow","easy","medium","quicker","faster","fast","very fast","snap"];
  function paintBlend(){
    if (!sl || !lab) return;
    lab.textContent = labels[Math.max(0, Math.min(9, (+sl.value||7)-1))];
    try { localStorage.setItem(STORE_BLEND, sl.value); } catch(e){}
    if (base === "auto") applyAutoBase();

    } catch(e){}

})();

const PRELAKE = { s: 35.50, w: -92.38, n: 35.68, e: -91.97 };
const prelakeImg = new Image();
prelakeImg.decoding = "async";
prelakeImg.src = "hist-prelake-valley.jpg";
const PrelakeGrid = L.GridLayer.extend({
  options: {
    opacity: 0.65,
    attribution: "USGS Mountain View 15-minute quad, 1894",
    minZoom: 9,
    maxZoom: 19,
    tileSize: 256,
    keepBuffer: 2
  },
  createTile(coords, done) {
    const tile = L.DomUtil.create("canvas", "leaflet-tile");
    const size = this.getTileSize();
    tile.width = size.x;
    tile.height = size.y;
    const ctx = tile.getContext("2d");
    const layer = this;
    const paint = () => {
      try {
        if (!prelakeImg.naturalWidth) { done(null, tile); return; }
        const bounds = layer._tileCoordsToBounds(coords);
        const tw = bounds.getWest(), te = bounds.getEast();
        const tn = bounds.getNorth(), ts = bounds.getSouth();
        const { s, w, n, e } = PRELAKE;
        if (te <= w || tw >= e || ts >= n || tn <= s) { done(null, tile); return; }
        const imgW = prelakeImg.naturalWidth, imgH = prelakeImg.naturalHeight;
        const sx0 = ((Math.max(tw, w) - w) / (e - w)) * imgW;
        const sx1 = ((Math.min(te, e) - w) / (e - w)) * imgW;
        const sy0 = ((n - Math.min(tn, n)) / (n - s)) * imgH;
        const sy1 = ((n - Math.max(ts, s)) / (n - s)) * imgH;
        const dx0 = ((Math.max(tw, w) - tw) / (te - tw)) * size.x;
        const dx1 = ((Math.min(te, e) - tw) / (te - tw)) * size.x;
        const dy0 = ((tn - Math.min(tn, n)) / (tn - ts)) * size.y;
        const dy1 = ((tn - Math.max(ts, s)) / (tn - ts)) * size.y;
        ctx.clearRect(0, 0, size.x, size.y);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(
          prelakeImg,
          sx0, sy0, Math.max(1, sx1 - sx0), Math.max(1, sy1 - sy0),
          dx0, dy0, Math.max(1, dx1 - dx0), Math.max(1, dy1 - dy0)
        );
        done(null, tile);
      } catch (err) {
        done(err, tile);
      }
    };
    if (prelakeImg.complete && prelakeImg.naturalWidth) paint();
    else {
      prelakeImg.addEventListener("load", paint, { once: true });
      prelakeImg.addEventListener("error", () => done(new Error("prelake load failed"), tile), { once: true });
    }
    return tile;
  }
});

    });
  } else if (editing.kind==="shared") {
    // moved from Shared to a personal category
    requireSharedUnlock().then(function(ok){
      if (!ok) return;
      deleteSharedPin(editing.id).then(function(){
        userPins.push({id:"u-"+Date.now(), name:name, lat:editing.lat, lng:editing.lng, cat:cat, fact:fact});
        finishLocal();
      });
    });
    return;
  } else {
    overrides[editing.key] = {name:name, lat:editing.lat, lng:editing.lng, cat:cat, fact:fact, tip:""};
  }
  finishLocal();
};


if (PUBLIC_VIEW) {
  document.title = "Greers Ferry Lake Explorer";
  var h1 = document.querySelector("header h1");
  if (h1) h1.textContent = "Greers Ferry Lake";
  var note = document.querySelector("p.note");
  if (note) note.textContent = "Add your own pins — lake pins stay put. Not a navigation chart.";
  document.body.classList.add("public-view");
  var unlockRow = document.querySelector(".unlock-row");
  if (unlockRow) unlockRow.style.display = "none";
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(function(){});
}
</script>
