<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a2438" />
<title>Greers Ferry Lake Explorer</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { --bg:#071822; --ink:#e8f2f7; --accent:#c49a58; --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px); }
  * { box-sizing:border-box; }
  html,body,#map { height:100%; margin:0; }
  body { font-family:-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { position:absolute; top:0; left:0; right:0; z-index:800; display:flex; gap:8px; align-items:center; padding:calc(8px + var(--safe-top)) 10px 8px; background:linear-gradient(180deg,#071822ee,#07182200); }
  h1 { font-size:15px; margin:0; flex:1; }
  header button, header input { border:0; border-radius:12px; padding:10px 12px; font-size:14px; background:#123447; color:var(--ink); }
  header input { flex:1.4; min-width:0; }
  .fabs { position:absolute; right:10px; bottom:calc(18px + var(--safe-bot)); z-index:800; display:flex; flex-direction:column; gap:8px; }
  .fab { width:48px; height:48px; border-radius:50%; border:0; background:#c49a58; color:#071822; font-weight:700; }
  .ghost { background:#123447; color:var(--ink); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background:#0e2a3a; color:#e8f2f7; }
  .note { position:absolute; left:10px; bottom:calc(14px + var(--safe-bot)); z-index:700; font-size:10px; color:#9bb4c4; max-width:55%; }
</style>
</head>
<body>
<header>
  <h1>Greers Ferry Lake</h1>
  <input id="q" type="search" placeholder="Search dam, marina…" />
  <button id="btn-layers" type="button">Layers</button>
  <button id="btn-locate" type="button">Me</button>
</header>
<div id="map"></div>
<div class="fabs">
  <button class="fab ghost" id="btn-north" type="button">N</button>
  <button class="fab" id="btn-pin" type="button">+</button>
</div>
<p class="note">Not a navigation chart. USACE / public map data.</p>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="coves.js"></script>
<script>
const PINS = [
  {name:"Greers Ferry Dam",lat:35.5208,lng:-91.9956,cat:"Infrastructure",fact:"USACE flood control and hydropower. JFK dedicated the dam Oct 3, 1963."},
  {name:"Visitor Center",lat:35.5219,lng:-91.9994,cat:"Park",fact:"Dam overlook and project exhibits."},
  {name:"Heber Springs",lat:35.4915,lng:-92.0313,cat:"Town",fact:"Cleburne County seat."},
  {name:"Greers Ferry",lat:35.5770,lng:-92.1630,cat:"Town",fact:"North shore above The Narrows."},
  {name:"Higden",lat:35.5666,lng:-92.2048,cat:"Town",fact:"Town relocated when the lake filled."},
  {name:"Fairfield Bay",lat:35.6050,lng:-92.2700,cat:"Town",fact:"West-arm resort community."},
  {name:"Edgemont",lat:35.6023,lng:-92.1963,cat:"Town",fact:"North of The Narrows."},
  {name:"The Narrows",lat:35.5511,lng:-92.1870,cat:"Landmark",fact:"Channel between the two basins."},
  {name:"Lacey's Narrows Marina",lat:35.5596,lng:-92.1942,cat:"Marina",fact:"Service and slips on The Narrows."},
  {name:"Shiloh Marina",lat:35.5392,lng:-92.1462,cat:"Marina",fact:"South-central arm."},
  {name:"Hill Creek Marina",lat:35.6078,lng:-92.1491,cat:"Marina",fact:"Devil's Fork arm."},
  {name:"Eden Isle Marina",lat:35.5013,lng:-92.0954,cat:"Marina",fact:"Near Heber Springs."},
  {name:"Sugar Loaf Mountain",lat:35.5612,lng:-92.2638,cat:"Landmark",fact:"Island summit, west basin."},
  {name:"Narrows Launch",lat:35.5633,lng:-92.1963,cat:"Park",fact:"Public ramp on The Narrows."},
  {name:"Old Highway 25 Park",lat:35.5342,lng:-92.0155,cat:"Park",fact:"Beach and ramp on the lower lake."},
  {name:"Party Cove",lat:35.5605,lng:-92.3322,cat:"Cove",fact:"West-arm gathering cove."},
  {name:"Hurricane Bay",lat:35.5499,lng:-92.1773,cat:"Cove",fact:"East of The Narrows."},
  {name:"Higden Bay",lat:35.5718,lng:-92.2138,cat:"Cove",fact:"Flooded Higden bottoms."},
  {name:"Devil's Fork Launch",lat:35.5919,lng:-92.1801,cat:"Park",fact:"North-arm public ramp."}
];
const extra = (typeof COVE_PINS !== "undefined") ? COVE_PINS : [];
const ALL = PINS.concat(extra.map(function(p){ return {name:p.name,lat:p.lat,lng:p.lng,cat:p.category||"Cove",fact:p.fact||""}; }));
const map = L.map("map", { zoomControl:false }).fitBounds([[35.48,-92.36],[35.66,-91.97]]);
L.control.zoom({ position:"bottomleft" }).addTo(map);
L.control.scale({ imperial:true, metric:false }).addTo(map);
const layers = {
  satellite: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom:19, attribution:"Esri" }),
  streets: L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19, attribution:"OSM" }),
  topo: L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", { maxZoom:17, attribution:"OTM" })
};
let base = "satellite";
layers.satellite.addTo(map);
function colorFor(cat){
  return ({Infrastructure:"#e8c98a",Park:"#4ecdc4",Marina:"#7bdff2",Landmark:"#c49a58",Town:"#f2d0a4",Cove:"#8ecae6"})[cat] || "#c49a58";
}
ALL.forEach(function(p){
  L.circleMarker([p.lat,p.lng], { radius:7, color:"#fff", weight:1, fillColor:colorFor(p.cat), fillOpacity:0.95 })
    .bindPopup("<b>"+p.name+"</b><br>"+(p.cat||"")+"<br>"+(p.fact||""))
    .addTo(map);
});
document.getElementById("btn-layers").onclick = function(){
  var order = ["satellite","streets","topo"];
  map.removeLayer(layers[base]);
  base = order[(order.indexOf(base)+1)%3];
  layers[base].addTo(map);
};
document.getElementById("btn-locate").onclick = function(){
  navigator.geolocation.getCurrentPosition(function(pos){
    var ll = [pos.coords.latitude, pos.coords.longitude];
    L.circleMarker(ll, { radius:7, color:"#fff", fillColor:"#4ecdc4", fillOpacity:1 }).addTo(map);
    map.setView(ll, 14);
  });
};
document.getElementById("q").onchange = function(){
  var s = this.value.toLowerCase();
  var hit = ALL.find(function(p){ return p.name.toLowerCase().indexOf(s) >= 0; });
  if (hit) map.setView([hit.lat, hit.lng], 15);
};
document.getElementById("btn-pin").onclick = function(){
  var c = map.getCenter();
  var name = prompt("Pin name?", "My pin");
  if (!name) return;
  L.circleMarker([c.lat,c.lng], { radius:8, color:"#fff", fillColor:"#e07a5f", fillOpacity:1 }).bindPopup(name).addTo(map);
  var saved = JSON.parse(localStorage.getItem("gfl-user-pins")||"[]");
  saved.push({name:name,lat:c.lat,lng:c.lng});
  localStorage.setItem("gfl-user-pins", JSON.stringify(saved));
};
JSON.parse(localStorage.getItem("gfl-user-pins")||"[]").forEach(function(pin){
  L.circleMarker([pin.lat,pin.lng], { radius:8, color:"#fff", fillColor:"#e07a5f", fillOpacity:1 }).bindPopup(pin.name).addTo(map);
});
</script>
</body>
</html>
