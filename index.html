<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a2438" />
<title>Greers Ferry Lake Explorer</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { --bg:#071822; --ink:#e8f2f7; --accent:#c49a58; --panel:#0e2a3a; --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px); }
  * { box-sizing:border-box; }
  html,body,#map { height:100%; margin:0; }
  body { font-family:-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { position:absolute; top:0; left:0; right:0; z-index:800; display:flex; gap:8px; align-items:center; padding:calc(8px + var(--safe-top)) 10px 8px; background:linear-gradient(180deg,#071822ee,#07182200); }
  h1 { font-size:15px; margin:0; white-space:nowrap; }
  header button, header input { border:0; border-radius:12px; padding:10px 12px; font-size:14px; background:#123447; color:var(--ink); }
  #search-wrap { position:relative; flex:1; min-width:0; }
  header input { width:100%; }
  #hits { display:none; position:absolute; left:0; right:0; top:100%; margin:4px 0 0; max-height:40vh; overflow:auto; background:var(--panel); border-radius:12px; list-style:none; padding:6px; box-shadow:0 8px 24px #0008; }
  #hits button { display:block; width:100%; text-align:left; background:transparent; border:0; color:var(--ink); padding:8px 10px; border-radius:8px; font-size:14px; }
  #hits button:hover, #hits button:focus { background:#123447; }
  .hits-meta { font-size:11px; color:#9bb4c4; margin-left:6px; }
  .sheet { display:none; position:absolute; z-index:900; right:10px; top:calc(56px + var(--safe-top)); width:min(280px, calc(100% - 20px)); background:var(--panel); border-radius:16px; padding:14px; box-shadow:0 12px 32px #0009; }
  .sheet.open { display:block; }
  .sheet h2 { font-size:13px; margin:0 0 10px; letter-spacing:.04em; text-transform:uppercase; color:#9bb4c4; }
  .row { display:flex; align-items:center; gap:8px; margin:8px 0; font-size:14px; }
  .row input { accent-color:var(--accent); }
  .swatch { width:10px; height:10px; border-radius:50%; border:1px solid #fff8; }
  .fabs { position:absolute; right:10px; bottom:calc(18px + var(--safe-bot)); z-index:800; display:flex; flex-direction:column; gap:8px; }
  .fab { width:48px; height:48px; border-radius:50%; border:0; background:#c49a58; color:#071822; font-weight:700; }
  .ghost { background:#123447; color:var(--ink); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background:#0e2a3a; color:#e8f2f7; }
  .note { position:absolute; left:10px; bottom:calc(14px + var(--safe-bot)); z-index:700; font-size:10px; color:#9bb4c4; max-width:52%; }
  .pin-form { display:none; position:absolute; z-index:950; left:50%; top:40%; transform:translate(-50%,-50%); width:min(300px,90vw); background:var(--panel); border-radius:16px; padding:16px; }
  .pin-form.open { display:block; }
  .pin-form input, .pin-form select, .pin-form textarea { width:100%; margin:8px 0 10px; border:0; border-radius:10px; padding:10px; background:#123447; color:var(--ink); font:inherit; }
  .pin-form textarea { min-height:64px; resize:vertical; }
  .pin-form .actions { display:flex; gap:8px; justify-content:flex-end; align-items:center; }
  .pin-form .actions .grow { margin-right:auto; }
  .pin-form button { border:0; border-radius:12px; padding:8px 14px; font-size:14px; background:#123447; color:var(--ink); }
  .pin-form .danger { background:#5c2430; color:#ffd7de; }
  .popup-actions { margin-top:10px; display:flex; gap:8px; }
  .popup-actions button { border:0; border-radius:10px; padding:6px 10px; background:#123447; color:#e8f2f7; font-size:13px; }
  .place-hint { display:none; position:absolute; z-index:850; left:50%; top:calc(58px + var(--safe-top)); transform:translateX(-50%); background:#c49a58; color:#071822; font-weight:700; font-size:13px; padding:8px 14px; border-radius:999px; white-space:nowrap; }
  .place-hint.on { display:block; }
  .fab.placing { box-shadow:0 0 0 3px #fff8; }

  .opacity-box {
    position:absolute; right:10px; bottom:calc(78px + var(--safe-bot)); z-index:800;
    background:#fff; color:#123; border-radius:10px; padding:8px 12px;
    display:flex; align-items:center; gap:10px; box-shadow:0 4px 16px #0005;
    font-size:13px; font-weight:600;
  }
  .opacity-box.hidden { display:none; }
  .opacity-box input[type=range] { width:120px; accent-color:#3b82f6; }

</style>
</head>
<body>
<header>
  <h1>Greers Ferry Lake</h1>
  <div id="search-wrap">
    <input id="q" type="search" placeholder="Search dam, marina, cove…" autocomplete="off" />
    <ul id="hits"></ul>
  </div>
  <button id="btn-layers" type="button">Layers</button>
  <button id="btn-locate" type="button">Me</button>
</header>
<div id="map"></div>
<div id="sheet" class="sheet" role="dialog" aria-label="Map layers">
  <h2>Base map</h2>
  <label class="row"><input type="radio" name="base" value="satellite" checked /> Satellite</label>
  <label class="row"><input type="radio" name="base" value="streets" /> Streets</label>
  <label class="row"><input type="radio" name="base" value="topo" /> Topo</label>
  <h2>Historical overlay</h2>
  <label class="row"><input type="checkbox" id="hist-on" /> USGS historic topo (scanned)</label>
  <label class="row"><input type="checkbox" id="prelake-on" checked /> Pre-lake valley (1894)</label>
  <h2>Pins</h2>
  <div id="cats"></div>
</div>
<div id="place-hint" class="place-hint">Tap the map to drop a pin</div>
<div id="pin-form" class="pin-form">
  <strong id="pin-form-title">Drop a pin</strong>
  <input id="pin-name" type="text" placeholder="Name this spot" />
  <select id="pin-cat">
    <option>My pins</option>
    <option>Cove</option>
    <option>Marina</option>
    <option>Park</option>
    <option>Landmark</option>
    <option>Town</option>
    <option>Infrastructure</option>
  </select>
  <textarea id="pin-fact" placeholder="Note (optional)"></textarea>
  <div class="actions">
    <button type="button" id="pin-delete" class="danger grow" hidden>Delete</button>
    <button type="button" id="pin-cancel">Cancel</button>
    <button type="button" id="pin-save" class="fab" style="width:auto;height:auto;border-radius:12px;padding:8px 14px;">Save</button>
  </div>
</div>
<div id="opacity-box" class="opacity-box">
  <span>Opacity</span>
  <input id="hist-opacity" type="range" min="0" max="100" value="65" />
</div>
<div class="fabs">
  <button class="fab ghost" id="btn-north" type="button" title="Reset north">N</button>
  <button class="fab" id="btn-pin" type="button" title="Add pin">+</button>
</div>
<p class="note">Not a navigation chart. USACE / public map data.</p>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="coves.js"></script>
<script>
const PINS = [
  {name:"Greers Ferry Dam",lat:35.5208,lng:-91.9956,cat:"Infrastructure",fact:"USACE flood control and hydropower. JFK dedicated the dam Oct 3, 1963."},
  {name:"Visitor Center",lat:35.5219,lng:-91.9994,cat:"Park",fact:"Dam overlook and project exhibits."},
  {name:"Heber Springs",lat:35.4915,lng:-92.0313,cat:"Town",fact:"Cleburne County seat."},
  {name:"Greers Ferry",lat:35.5770,lng:-92.1630,cat:"Town",fact:"North shore above The Narrows."},
  {name:"Higden",lat:35.5666,lng:-92.2048,cat:"Town",fact:"Town relocated when the lake filled."},
  {name:"Fairfield Bay",lat:35.6050,lng:-92.2700,cat:"Town",fact:"West-arm resort community."},
  {name:"Edgemont",lat:35.6023,lng:-92.1963,cat:"Town",fact:"North of The Narrows."},
  {name:"The Narrows",lat:35.5511,lng:-92.1870,cat:"Landmark",fact:"Channel between the two basins."},
  {name:"Lacey's Narrows Marina",lat:35.5596,lng:-92.1942,cat:"Marina",fact:"Service and slips on The Narrows."},
  {name:"Shiloh Marina",lat:35.5392,lng:-92.1462,cat:"Marina",fact:"South-central arm."},
  {name:"Hill Creek Marina",lat:35.6078,lng:-92.1491,cat:"Marina",fact:"Devil's Fork arm."},
  {name:"Eden Isle Marina",lat:35.5013,lng:-92.0954,cat:"Marina",fact:"Near Heber Springs."},
  {name:"Sugar Loaf Mountain",lat:35.5612,lng:-92.2638,cat:"Landmark",fact:"Island summit, west basin."},
  {name:"Narrows Launch",lat:35.5633,lng:-92.1963,cat:"Park",fact:"Public ramp on The Narrows."},
  {name:"Old Highway 25 Park",lat:35.5342,lng:-92.0155,cat:"Park",fact:"Beach and ramp on the lower lake."},
  {name:"Party Cove",lat:35.5605,lng:-92.3322,cat:"Cove",fact:"West-arm gathering cove."},
  {name:"Hurricane Bay",lat:35.5499,lng:-92.1773,cat:"Cove",fact:"East of The Narrows."},
  {name:"Higden Bay",lat:35.5718,lng:-92.2138,cat:"Cove",fact:"Flooded Higden bottoms."},
  {name:"Devil's Fork Launch",lat:35.5919,lng:-92.1801,cat:"Park",fact:"North-arm public ramp."}
];
const extra = (typeof COVE_PINS !== "undefined") ? COVE_PINS : [];
const ALL = PINS.concat(extra.map(function(p){
  return {name:p.name,lat:p.lat,lng:p.lng,cat:p.category||"Cove",fact:p.fact||"",tip:p.tip||""};
}));
const COLORS = {Infrastructure:"#e8c98a",Park:"#4ecdc4",Marina:"#7bdff2",Landmark:"#c49a58",Town:"#f2d0a4",Cove:"#8ecae6","My pins":"#e07a5f"};
function colorFor(cat){ return COLORS[cat] || "#c49a58"; }
function esc(s){ return String(s||"").replace(/[&<>"']/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }
function stockKey(p){ return p.name+"|"+p.lat+"|"+p.lng; }
const STORE_USER = "gfl-user-pins";
const STORE_OVR = "gfl-pin-overrides";
let userPins = JSON.parse(localStorage.getItem(STORE_USER)||"[]");
let overrides = JSON.parse(localStorage.getItem(STORE_OVR)||"{}");
userPins = userPins.map(function(p,i){
  if (!p.id) p.id = "u-"+Date.now()+"-"+i;
  if (!p.cat) p.cat = "My pins";
  return p;
});
function persistPins(){
  localStorage.setItem(STORE_USER, JSON.stringify(userPins));
  localStorage.setItem(STORE_OVR, JSON.stringify(overrides));
}
function visiblePins(){
  const stock = ALL.map(function(p){
    const key = stockKey(p);
    const o = overrides[key];
    if (o && o.deleted) return null;
    const out = Object.assign({kind:"stock", key:key}, p);
    if (o) { if (o.name!=null) out.name=o.name; if (o.lat!=null) out.lat=o.lat; if (o.lng!=null) out.lng=o.lng; if (o.cat) out.cat=o.cat; if (o.fact!=null) out.fact=o.fact; if (o.tip!=null) out.tip=o.tip; }
    return out;
  }).filter(Boolean);
  const mine = userPins.map(function(p){ return Object.assign({kind:"user"}, p); });
  return stock.concat(mine);
}

const map = L.map("map", { zoomControl:false }).fitBounds([[35.48,-92.36],[35.66,-91.97]]);
L.control.zoom({ position:"bottomleft" }).addTo(map);
L.control.scale({ imperial:true, metric:false }).addTo(map);
const layers = {
  satellite: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom:19, attribution:"Esri" }),
  streets: L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19, attribution:"OSM" }),
  topo: L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", { maxZoom:17, attribution:"OTM" })
};
let base = "satellite";
layers.satellite.addTo(map);

const hist = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/USA_Topo_Maps/MapServer/tile/{z}/{y}/{x}", {
  maxZoom:15, opacity:0.55, attribution:"Esri / USGS historic topo"
});
const histOn = document.getElementById("hist-on");
const prelakeOn = document.getElementById("prelake-on");
const opacityBox = document.getElementById("opacity-box");
const opacitySlider = document.getElementById("hist-opacity");
const prelake = L.imageOverlay("hist-prelake-valley.jpg", [[35.50, -92.38], [35.68, -91.97]], {
  opacity: 0.65, attribution: "USGS Mountain View 15-minute quad, 1894"
}).addTo(map);
function anyOverlay(){ return histOn.checked || prelakeOn.checked; }
function setOverlays(){
  if (histOn.checked) { if (!map.hasLayer(hist)) hist.addTo(map); }
  else if (map.hasLayer(hist)) map.removeLayer(hist);
  if (prelakeOn.checked) { if (!map.hasLayer(prelake)) prelake.addTo(map); }
  else if (map.hasLayer(prelake)) map.removeLayer(prelake);
  opacityBox.classList.toggle("hidden", !anyOverlay());
  const o = opacitySlider.value / 100;
  hist.setOpacity(o);
  prelake.setOpacity(o);
}
histOn.onchange = setOverlays;
prelakeOn.onchange = setOverlays;
opacitySlider.oninput = setOverlays;


let groups = {};
const catsEl = document.getElementById("cats");
const catOn = {};
function popupHtml(p){
  return "<b>"+esc(p.name)+"</b><br>"+esc(p.cat||"")+(p.fact?"<br>"+esc(p.fact):"")+(p.tip?"<br><i>"+esc(p.tip)+"</i>":"")+'<div class="popup-actions"><button type="button" class="pin-edit">Edit</button><button type="button" class="pin-del">Delete</button></div>';
}
function bindPopupActions(marker, p){
  marker.on("popupopen", function(){
    const root = marker.getPopup().getElement();
    if (!root) return;
    const edit = root.querySelector(".pin-edit");
    const del = root.querySelector(".pin-del");
    if (edit) edit.onclick = function(){ marker.closePopup(); openPinForm(p); };
    if (del) del.onclick = function(){ marker.closePopup(); if (confirm("Remove "+p.name+"?")) removePin(p); };
  });
}
function renderPins(){
  Object.keys(groups).forEach(function(cat){ map.removeLayer(groups[cat]); });
  groups = {};
  visiblePins().forEach(function(p){
    if (!groups[p.cat]) groups[p.cat] = L.layerGroup();
    const marker = L.circleMarker([p.lat,p.lng], { radius: p.kind==="user" ? 8 : 7, color:"#fff", weight:1, fillColor:colorFor(p.cat), fillOpacity:0.95 });
    marker.bindPopup(popupHtml(p));
    bindPopupActions(marker, p);
    marker.addTo(groups[p.cat]);
  });
  catsEl.innerHTML = "";
  Object.keys(groups).sort().forEach(function(cat){
    const on = catOn[cat] !== false;
    if (on) groups[cat].addTo(map);
    const id = "cat-"+cat.replace(/\s+/g,"-");
    const row = document.createElement("label");
    row.className = "row";
    row.innerHTML = '<input type="checkbox" '+(on?"checked":"")+' id="'+id+'" /> <span class="swatch" style="background:'+colorFor(cat)+'"></span> '+cat+' <span class="hits-meta">'+groups[cat].getLayers().length+'</span>';
    catsEl.appendChild(row);
    row.querySelector("input").onchange = function(){
      catOn[cat] = this.checked;
      if (this.checked) map.addLayer(groups[cat]); else map.removeLayer(groups[cat]);
    };
  });
}
renderPins();

document.querySelectorAll('input[name="base"]').forEach(function(r){
  r.onchange = function(){
    map.removeLayer(layers[base]);
    base = this.value;
    layers[base].addTo(map);
  };
});

const sheet = document.getElementById("sheet");
document.getElementById("btn-layers").onclick = function(){
  sheet.classList.toggle("open");
};
map.on("click", function(e){
  sheet.classList.remove("open");
  hideHits();
  if (placing) {
    placing = false;
    syncPlaceUi();
    openPinForm({kind:"new", lat:e.latlng.lat, lng:e.latlng.lng});
  }
});

document.getElementById("btn-north").onclick = function(){ map.setBearing ? map.setBearing(0) : map.setView(map.getCenter(), map.getZoom()); };
document.getElementById("btn-locate").onclick = function(){
  navigator.geolocation.getCurrentPosition(function(pos){
    var ll = [pos.coords.latitude, pos.coords.longitude];
    L.circleMarker(ll, { radius:7, color:"#fff", fillColor:"#4ecdc4", fillOpacity:1 }).addTo(map);
    map.setView(ll, 14);
  });
};

const q = document.getElementById("q");
const hits = document.getElementById("hits");
function hideHits(){ hits.style.display = "none"; hits.innerHTML = ""; }
function showHits(list){
  hits.innerHTML = "";
  list.slice(0,12).forEach(function(p){
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = p.name+' <span class="hits-meta">'+p.cat+"</span>";
    b.onclick = function(){
      map.setView([p.lat, p.lng], 15);
      hideHits();
      q.value = p.name;
    };
    li.appendChild(b);
    hits.appendChild(li);
  });
  hits.style.display = list.length ? "block" : "none";
}
q.addEventListener("input", function(){
  const s = this.value.trim().toLowerCase();
  if (s.length < 2) { hideHits(); return; }
  showHits(visiblePins().filter(function(p){ return p.name.toLowerCase().indexOf(s) >= 0; }));
});
q.addEventListener("keydown", function(e){
  if (e.key === "Enter") {
    const s = this.value.trim().toLowerCase();
    const hit = visiblePins().find(function(p){ return p.name.toLowerCase().indexOf(s) >= 0; });
    if (hit) { map.setView([hit.lat, hit.lng], 15); hideHits(); }
  }
  if (e.key === "Escape") hideHits();
});

const pinForm = document.getElementById("pin-form");
const pinName = document.getElementById("pin-name");
const pinCat = document.getElementById("pin-cat");
const pinFact = document.getElementById("pin-fact");
const pinDelete = document.getElementById("pin-delete");
const pinFormTitle = document.getElementById("pin-form-title");
const placeHint = document.getElementById("place-hint");
const btnPin = document.getElementById("btn-pin");
let placing = false;
let editing = null;
function syncPlaceUi(){
  placeHint.classList.toggle("on", placing);
  btnPin.classList.toggle("placing", placing);
}
function closePinForm(){
  pinForm.classList.remove("open");
  editing = null;
  pinDelete.hidden = true;
}
function openPinForm(p){
  editing = p;
  pinFormTitle.textContent = p.kind==="new" ? "Drop a pin" : "Edit pin";
  pinName.value = p.name || "";
  pinCat.value = p.cat && COLORS[p.cat] ? p.cat : (p.kind==="new" ? "My pins" : (p.cat || "My pins"));
  if (![].some.call(pinCat.options, function(o){ return o.value===pinCat.value; })) {
    pinCat.value = "My pins";
  }
  pinFact.value = p.fact || p.tip || "";
  pinDelete.hidden = p.kind==="new";
  pinForm.classList.add("open");
  pinName.focus();
}
function removePin(p){
  if (p.kind==="user") userPins = userPins.filter(function(x){ return x.id !== p.id; });
  else overrides[p.key] = {deleted:true};
  persistPins();
  closePinForm();
  renderPins();
}
btnPin.onclick = function(){
  if (pinForm.classList.contains("open")) closePinForm();
  placing = !placing;
  syncPlaceUi();
};
document.getElementById("pin-cancel").onclick = function(){ closePinForm(); placing=false; syncPlaceUi(); };
pinDelete.onclick = function(){
  if (!editing || editing.kind==="new") return;
  if (confirm("Remove "+(editing.name||"this pin")+"?")) removePin(editing);
};
document.getElementById("pin-save").onclick = function(){
  const name = pinName.value.trim();
  if (!name) return;
  const cat = pinCat.value || "My pins";
  const fact = pinFact.value.trim();
  if (!editing || editing.kind==="new") {
    const ll = editing && editing.lat!=null ? {lat:editing.lat,lng:editing.lng} : map.getCenter();
    userPins.push({id:"u-"+Date.now(), name:name, lat:ll.lat, lng:ll.lng, cat:cat, fact:fact});
  } else if (editing.kind==="user") {
    userPins = userPins.map(function(x){
      if (x.id !== editing.id) return x;
      return Object.assign({}, x, {name:name, cat:cat, fact:fact});
    });
  } else {
    overrides[editing.key] = {name:name, lat:editing.lat, lng:editing.lng, cat:cat, fact:fact, tip:""};
  }
  persistPins();
  closePinForm();
  renderPins();
};

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(function(){});
}
</script>
</body>
</html>
